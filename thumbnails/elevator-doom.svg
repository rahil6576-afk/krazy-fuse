<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dark Roguelite Shaft Gradient -->
    <linearGradient id="ed-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="35%" stop-color="#0c0e14"/>
      <stop offset="70%" stop-color="#180a0d"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>

    <!-- Emergency Siren Red Glow -->
    <radialGradient id="siren-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>

    <!-- Hazard Stripes Pattern -->
    <pattern id="hazard-pattern" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#facc15"/>
      <rect x="20" width="20" height="40" fill="#09090b"/>
    </pattern>

    <filter id="ed-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ed-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background: Elevator Shaft -->
  <rect width="1280" height="720" fill="url(#ed-bg)"/>

  <!-- Steel Girders & Tension Cables on Shaft Walls -->
  <g stroke="#1e293b" stroke-width="6" opacity="0.6">
    <!-- Vertical Guide Rails -->
    <line x1="280" y1="0" x2="280" y2="720"/>
    <line x1="1000" y1="0" x2="1000" y2="720"/>
    <!-- Tension Cables -->
    <line x1="420" y1="0" x2="420" y2="720" stroke="#475569" stroke-width="4"/>
    <line x1="860" y1="0" x2="860" y2="720" stroke="#475569" stroke-width="4"/>
    <!-- Diagonal Cross Bracing -->
    <line x1="0" y1="120" x2="280" y2="360" stroke-width="4"/>
    <line x1="0" y1="600" x2="280" y2="360" stroke-width="4"/>
    <line x1="1280" y1="120" x2="1000" y2="360" stroke-width="4"/>
    <line x1="1280" y1="600" x2="1000" y2="360" stroke-width="4"/>
  </g>

  <!-- Flashing Emergency Beacon Sirens (Top corners) -->
  <g transform="translate(320, 180)">
    <circle cx="0" cy="0" r="140" fill="url(#siren-glow)"/>
    <polygon points="-25,15 25,15 15,-25 -15,-25" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <rect x="-30" y="15" width="60" height="15" rx="3" fill="#334155"/>
  </g>
  <g transform="translate(960, 180)">
    <circle cx="0" cy="0" r="140" fill="url(#siren-glow)"/>
    <polygon points="-25,15 25,15 15,-25 -15,-25" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <rect x="-30" y="15" width="60" height="15" rx="3" fill="#334155"/>
  </g>

  <!-- Industrial Open Elevator Cage -->
  <g transform="translate(640, 440)" filter="url(#ed-shadow)">
    <!-- Elevator Floor Platform -->
    <polygon points="-360,180 360,180 300,240 -300,240" fill="#1e293b" stroke="#334155" stroke-width="4"/>

    <!-- Hazard Warning Stripe Trim along Beam -->
    <rect x="-340" y="140" width="680" height="28" fill="url(#hazard-pattern)" stroke="#09090b" stroke-width="2"/>

    <!-- Elevator Cage Mesh Walls (Background) -->
    <rect x="-320" y="-220" width="640" height="360" fill="#090d14" opacity="0.85" stroke="#334155" stroke-width="6"/>
    <!-- Wire Mesh Grate -->
    <g stroke="#1e293b" stroke-width="2" opacity="0.5">
      <line x1="-320" y1="-140" x2="320" y2="-140"/>
      <line x1="-320" y1="-60" x2="320" y2="-60"/>
      <line x1="-320" y1="20" x2="320" y2="20"/>
      <line x1="-320" y1="100" x2="320" y2="100"/>
      <line x1="-200" y1="-220" x2="-200" y2="140"/>
      <line x1="-80" y1="-220" x2="-80" y2="140"/>
      <line x1="40" y1="-220" x2="40" y2="140"/>
      <line x1="160" y1="-220" x2="160" y2="140"/>
    </g>

    <!-- Top Overhead Beam with Hazard Stripes -->
    <rect x="-340" y="-260" width="680" height="40" fill="url(#hazard-pattern)" stroke="#09090b" stroke-width="3"/>

    <!-- Digital Floor 99 LED Display Box -->
    <g transform="translate(0, -260)" filter="url(#ed-shadow)">
      <rect x="-110" y="-55" width="220" height="65" rx="8" fill="#05070a" stroke="#ef4444" stroke-width="3"/>
      <!-- Glowing 7-Segment Digital 99 -->
      <text x="0" y="-10" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900" fill="#ef4444" text-anchor="middle" letter-spacing="6" filter="url(#ed-glow)">99</text>
      <text x="0" y="-40" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="2">FLOOR ELEVATION</text>
    </g>

    <!-- Rugged Survivor In Elevator Cage -->
    <g transform="translate(0, 30)">
      <!-- Survivor Shadow -->
      <ellipse cx="0" cy="110" rx="90" ry="24" fill="#020617" opacity="0.8"/>

      <!-- Armored Survivor Silhouette (Combat Ready Stance) -->
      <!-- Helmet with glowing visor -->
      <circle cx="0" cy="-90" r="28" fill="#1e293b" stroke="#09090b" stroke-width="3"/>
      <rect x="-18" y="-95" width="36" height="12" rx="4" fill="#38bdf8" filter="url(#ed-glow)"/>

      <!-- Tactical Heavy Body Armor -->
      <path d="M -45,-55 L 45,-55 L 35,40 L -35,40 Z" fill="#1e293b" stroke="#09090b" stroke-width="4"/>
      <!-- Utility Pouches / Belt -->
      <rect x="-35" y="30" width="70" height="14" rx="3" fill="#475569"/>

      <!-- Legs in Sturdy Combat Stance -->
      <path d="M -25,40 L -65,115 L -85,115" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
      <path d="M 25,40 L 65,115 L 85,115" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>

      <!-- Right Arm Holding Glowing Plasma Wrench Weapon -->
      <path d="M 35,-45 L 85,-20 L 115,-50" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
      <!-- Plasma Arc Wrench -->
      <rect x="105" y="-120" width="16" height="85" rx="4" fill="#64748b" stroke="#09090b" stroke-width="2"/>
      <!-- Wrench Jaw Head -->
      <path d="M 95,-130 L 135,-130 L 135,-110 L 115,-110 L 115,-100 L 95,-100 Z" fill="#94a3b8"/>
      <!-- Electric Lightning Arcs from Weapon -->
      <path d="M 85,-140 L 115,-115 L 90,-95 L 140,-80" fill="none" stroke="#00f5ff" stroke-width="4" filter="url(#ed-glow)"/>
    </g>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(640, 65)">
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#09090b" stroke="#ef4444" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      ELEVATOR OF DOOM <tspan fill="#ef4444">🚨 FLOOR 99</tspan>
    </text>
  </g>
</svg>
