<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Aged Washi Paper Gradient -->
    <radialGradient id="washi-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="60%" stop-color="#f2e8d5"/>
      <stop offset="90%" stop-color="#e3d4bd"/>
      <stop offset="100%" stop-color="#d6c3a5"/>
    </radialGradient>

    <!-- Ink Filter for Authentic Sumi Paper Bleed -->
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Hanko Stamp Red Gradient -->
    <linearGradient id="hanko-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <filter id="sumi-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#382f2d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Washi Paper Background -->
  <rect width="1280" height="720" fill="url(#washi-bg)"/>

  <!-- Subtle Washi Paper Fibers / Speckles -->
  <g opacity="0.15" stroke="#78593c" stroke-width="1.5">
    <line x1="80" y1="120" x2="100" y2="128"/>
    <line x1="420" y1="90" x2="445" y2="95"/>
    <line x1="880" y1="160" x2="905" y2="155"/>
    <line x1="1120" y1="280" x2="1140" y2="290"/>
    <line x1="220" y1="520" x2="240" y2="530"/>
    <line x1="720" y1="640" x2="740" y2="645"/>
    <line x1="1040" y1="580" x2="1065" y2="575"/>
  </g>

  <!-- Distant Sumi Bamboo Stalks Silhouette (Left Side) -->
  <g opacity="0.18" fill="#2d2825">
    <!-- Tall Bamboo Stalk -->
    <path d="M 120,720 L 126,520 L 123,515 L 129,320 L 125,315 L 131,100 L 127,95 L 132,0 L 146,0 L 141,95 L 145,100 L 139,315 L 143,320 L 137,515 L 140,520 L 134,720 Z"/>
    <!-- Bamboo Leaves -->
    <path d="M 140,320 Q 220,330 260,370 Q 200,350 140,320 Z"/>
    <path d="M 140,315 Q 190,290 230,270 Q 180,295 140,315 Z"/>
    <path d="M 145,100 Q 240,80 290,110 Q 210,100 145,100 Z"/>
  </g>

  <!-- Minimalist Zen Board Grid (Center) -->
  <g stroke="#8c7864" stroke-width="4" stroke-linecap="round" opacity="0.45" filter="url(#ink-bleed)">
    <!-- Vertical Lines -->
    <line x1="520" y1="160" x2="520" y2="580"/>
    <line x1="760" y1="160" x2="760" y2="580"/>
    <!-- Horizontal Lines -->
    <line x1="380" y1="300" x2="900" y2="300"/>
    <line x1="380" y1="440" x2="900" y2="440"/>
  </g>

  <!-- Left: Bold Expressive Calligraphy Brushstroke Sumi X -->
  <g transform="translate(420, 370)" filter="url(#ink-bleed)" opacity="0.92">
    <!-- Stroke 1 (Top-Left to Bottom-Right) -->
    <path d="M -85,-90 C -60,-80 -20,-30 0,0 C 25,35 65,75 90,95 C 75,90 35,60 0,20 C -35,-20 -70,-65 -85,-90 Z"
          fill="#1c1917" filter="url(#sumi-shadow)"/>
    <!-- Dry brush bristle tails -->
    <path d="M 85,90 Q 110,105 125,115" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <path d="M 80,95 Q 100,112 115,125" stroke="#1c1917" stroke-width="2" stroke-linecap="round"/>

    <!-- Stroke 2 (Top-Right to Bottom-Left) -->
    <path d="M 80,-85 C 60,-65 20,-20 0,0 C -25,25 -65,65 -90,85 C -75,75 -35,45 0,10 C 35,-25 65,-65 80,-85 Z"
          fill="#292524" filter="url(#sumi-shadow)"/>
    <!-- Ink Splatters -->
    <circle cx="-105" cy="-75" r="4" fill="#1c1917"/>
    <circle cx="-115" cy="-60" r="2.5" fill="#1c1917"/>
    <circle cx="95" cy="-95" r="3" fill="#1c1917"/>
    <circle cx="105" cy="80" r="4" fill="#1c1917"/>
  </g>

  <!-- Right: Dynamic Calligraphy Ensō Circle O (Zen Circle) -->
  <g transform="translate(760, 370)" filter="url(#ink-bleed)" opacity="0.94">
    <!-- Master Takahashi's Ensō Stroke (Starts thin at top, swells heavy on left and bottom, tapers out at top-right) -->
    <path d="M 15,-110 C 80,-115 125,-60 125,10 C 125,75 80,125 5,125 C -70,125 -125,70 -125,-5 C -125,-80 -65,-120 0,-120 C 5,-120 10,-115 5,-110 C -55,-105 -100,-70 -100,-5 C -100,60 -55,105 5,105 C 65,105 105,60 105,10 C 105,-50 65,-95 15,-95 C 10,-95 5,-105 15,-110 Z"
          fill="#181513" filter="url(#sumi-shadow)"/>

    <!-- Ensō Brush Splash & Flying White (Kohi / Dry-brush streaks) -->
    <path d="M -85,60 C -95,85 -80,95 -60,110" stroke="#181513" stroke-width="5" stroke-linecap="round"/>
    <path d="M -75,70 C -85,95 -70,105 -50,118" stroke="#181513" stroke-width="3" stroke-linecap="round"/>
    <circle cx="125" cy="-20" r="4" fill="#181513"/>
    <circle cx="135" cy="5" r="3" fill="#181513"/>
    <circle cx="-135" cy="-15" r="5" fill="#181513"/>
  </g>

  <!-- Traditional Japanese Vermilion Hanko Seal Stamp (Lower Right) -->
  <g transform="translate(1080, 560)">
    <!-- Square Red Seal Border with Carved Imperfections -->
    <rect x="-45" y="-45" width="90" height="90" rx="6" fill="none" stroke="url(#hanko-red)" stroke-width="7" opacity="0.92"/>
    <rect x="-40" y="-40" width="80" height="80" rx="4" fill="#dc2626" opacity="0.12"/>
    <!-- Kanji Symbol: 墨 (Sumi / Black Ink) -->
    <text x="0" y="16" font-family="'Shippori Mincho', 'Yuji Boku', 'serif'" font-size="52" font-weight="900" fill="url(#hanko-red)" text-anchor="middle" opacity="0.95">墨</text>
  </g>

  <!-- Top Title Plaque (Traditional Hanging Scroll Aesthetic) -->
  <g transform="translate(640, 65)">
    <rect x="-260" y="-30" width="520" height="60" rx="8" fill="#1c1917" stroke="#8c7864" stroke-width="3"/>
    <text x="0" y="10" font-family="'Shippori Mincho', 'Yuji Boku', serif" font-size="28" font-weight="700" fill="#fdfbf7" text-anchor="middle" letter-spacing="4">
      SUMI-E TAC TOE <tspan fill="#f59e0b">· 禅 ZEN BRUSH</tspan>
    </text>
  </g>
</svg>
