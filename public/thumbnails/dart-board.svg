<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm Tavern Pub Background -->
    <radialGradient id="pub-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="45%" stop-color="#231309"/>
      <stop offset="85%" stop-color="#0e0703"/>
      <stop offset="100%" stop-color="#050201"/>
    </radialGradient>

    <!-- Warm Edison Light Glow -->
    <radialGradient id="edison-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Brass Metallic Gradient for Darts -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Chrome Silver Shaft Gradient -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="dart-shadow">
      <feDropShadow dx="10" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="bullseye-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Dark Mahogany Wood Pub Wall -->
  <rect width="1280" height="720" fill="url(#pub-bg)"/>

  <!-- Vertical Wood Planks Lines -->
  <g stroke="#1a0c04" stroke-width="4" opacity="0.6">
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="360" y1="0" x2="360" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="760" y1="0" x2="760" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1160" y1="0" x2="1160" y2="720"/>
  </g>

  <!-- Ambient Hanging Edison Lamps (Top corners) -->
  <g transform="translate(180, 0)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#000000" stroke-width="3"/>
    <circle cx="0" cy="140" r="100" fill="url(#edison-glow)"/>
    <ellipse cx="0" cy="135" rx="14" ry="22" fill="#fef08a" opacity="0.9"/>
  </g>
  <g transform="translate(1100, 0)">
    <line x1="0" y1="0" x2="0" y2="120" stroke="#000000" stroke-width="3"/>
    <circle cx="0" cy="140" r="100" fill="url(#edison-glow)"/>
    <ellipse cx="0" cy="135" rx="14" ry="22" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Central Dartboard Setup -->
  <g transform="translate(640, 390)" filter="url(#dart-shadow)">
    <!-- Outer Black Catch Ring -->
    <circle cx="0" cy="0" r="280" fill="#0f0905" stroke="#2b180d" stroke-width="8"/>

    <!-- Outer Scoring Wire Ring -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Segment Pattern (Simulated Classic 20-Bed Alternating Black & Cream) -->
    <!-- Cream Base -->
    <circle cx="0" cy="0" r="225" fill="#fcf6e8"/>

    <!-- Alternating Black Wedges (every 18 deg) -->
    <g fill="#181310">
      <path d="M 0,0 L 35,-222 A 225,225 0 0,1 102,-200 Z"/>
      <path d="M 0,0 L 195,-112 A 225,225 0 0,1 222,-35 Z"/>
      <path d="M 0,0 L 222,35 A 225,225 0 0,1 195,112 Z"/>
      <path d="M 0,0 L 102,200 A 225,225 0 0,1 35,222 Z"/>
      <path d="M 0,0 L -35,222 A 225,225 0 0,1 -102,200 Z"/>
      <path d="M 0,0 L -195,112 A 225,225 0 0,1 -222,35 Z"/>
      <path d="M 0,0 L -222,-35 A 225,225 0 0,1 -195,-112 Z"/>
      <path d="M 0,0 L -102,-200 A 225,225 0 0,1 -35,-222 Z"/>
    </g>

    <!-- Double Ring (Outer Emerald & Crimson alternating band) -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="#15803d" stroke-width="16" stroke-dasharray="34 34"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="#dc2626" stroke-width="16" stroke-dasharray="34 34" stroke-dashoffset="34"/>

    <!-- Triple Ring (Inner Emerald & Crimson alternating band) -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="#15803d" stroke-width="14" stroke-dasharray="21 21"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#dc2626" stroke-width="14" stroke-dasharray="21 21" stroke-dashoffset="21"/>

    <!-- Outer Bull (Green 25 Ring) -->
    <circle cx="0" cy="0" r="32" fill="#15803d" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Inner Bullseye (Red 50 Center) -->
    <circle cx="0" cy="0" r="16" fill="#dc2626" stroke="#e2e8f0" stroke-width="2" filter="url(#bullseye-glow)"/>

    <!-- Wire Spider Grid Overlay (Radial Spokes) -->
    <g stroke="#cbd5e1" stroke-width="1.8" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-225"/>
      <line x1="0" y1="0" x2="70" y2="-214"/>
      <line x1="0" y1="0" x2="132" y2="-182"/>
      <line x1="0" y1="0" x2="182" y2="-132"/>
      <line x1="0" y1="0" x2="214" y2="-70"/>
      <line x1="0" y1="0" x2="225" y2="0"/>
      <line x1="0" y1="0" x2="214" y2="70"/>
      <line x1="0" y1="0" x2="182" y2="132"/>
      <line x1="0" y1="0" x2="132" y2="182"/>
      <line x1="0" y1="0" x2="70" y2="214"/>
      <line x1="0" y1="0" x2="0" y2="225"/>
      <line x1="0" y1="0" x2="-70" y2="214"/>
      <line x1="0" y1="0" x2="-132" y2="182"/>
      <line x1="0" y1="0" x2="-182" y2="132"/>
      <line x1="0" y1="0" x2="-214" y2="70"/>
      <line x1="0" y1="0" x2="-225" y2="0"/>
      <line x1="0" y1="0" x2="-214" y2="-70"/>
      <line x1="0" y1="0" x2="-182" y2="-132"/>
      <line x1="0" y1="0" x2="-132" y2="-182"/>
      <line x1="0" y1="0" x2="-70" y2="-214"/>
    </g>

    <!-- Classic Wire Numbers around Ring -->
    <text x="0" y="-242" font-family="'Impact', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">20</text>
    <text x="145" y="-195" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">18</text>
    <text x="235" y="-70" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">13</text>
    <text x="245" y="60" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">10</text>
    <text x="145" y="210" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">15</text>
    <text x="0" y="265" font-family="'Impact', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">3</text>
    <text x="-145" y="210" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">7</text>
    <text x="-245" y="60" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">8</text>
    <text x="-235" y="-70" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">14</text>
    <text x="-145" y="-195" font-family="'Impact', sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">5</text>

    <!-- Three Precision Tungsten Darts Clustered in Center Bullseye! -->
    <!-- Dart 1 (Top Center) -->
    <g transform="translate(2, -2) rotate(-15)">
      <!-- Barrel & Shaft -->
      <line x1="0" y1="0" x2="-35" y2="-140" stroke="url(#silver-grad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-15" y1="-60" x2="-25" y2="-100" stroke="url(#brass-grad)" stroke-width="9" stroke-linecap="round"/>
      <!-- Red & White Flight -->
      <polygon points="-35,-140 -50,-185 -30,-190 -20,-150" fill="#dc2626"/>
      <polygon points="-35,-140 -20,-185 -40,-190 -45,-150" fill="#ffffff"/>
    </g>

    <!-- Dart 2 (Bottom Left) -->
    <g transform="translate(-4, 4) rotate(45)">
      <line x1="0" y1="0" x2="-35" y2="-140" stroke="url(#silver-grad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-15" y1="-60" x2="-25" y2="-100" stroke="url(#brass-grad)" stroke-width="9" stroke-linecap="round"/>
      <polygon points="-35,-140 -50,-185 -30,-190 -20,-150" fill="#dc2626"/>
      <polygon points="-35,-140 -20,-185 -40,-190 -45,-150" fill="#ffffff"/>
    </g>

    <!-- Dart 3 (Right) -->
    <g transform="translate(6, 2) rotate(-65)">
      <line x1="0" y1="0" x2="-35" y2="-140" stroke="url(#silver-grad)" stroke-width="6" stroke-linecap="round"/>
      <line x1="-15" y1="-60" x2="-25" y2="-100" stroke="url(#brass-grad)" stroke-width="9" stroke-linecap="round"/>
      <polygon points="-35,-140 -50,-185 -30,-190 -20,-150" fill="#dc2626"/>
      <polygon points="-35,-140 -20,-185 -40,-190 -45,-150" fill="#ffffff"/>
    </g>
  </g>

  <!-- 180 Perfect Score Graphic Badge (Left Side) -->
  <g transform="translate(240, 360)" filter="url(#dart-shadow)">
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#d97706" stroke-width="4"/>
    <text x="0" y="-8" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#facc15" text-anchor="middle">180</text>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAXIMUM</text>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(640, 65)">
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#0c0704" stroke="#d97706" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      DART MASTER <tspan fill="#f59e0b">🎯 301 / 501 ARENA</tspan>
    </text>
  </g>
</svg>
