<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Midnight Corporate Cyber Background -->
    <linearGradient id="oe-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#08121e"/>
      <stop offset="85%" stop-color="#0f233a"/>
      <stop offset="100%" stop-color="#030914"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="oe-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="oe-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#oe-bg)"/>

  <!-- Perspective Office Grid Floor -->
  <g opacity="0.3" stroke="#00f0ff" stroke-width="1.5">
    <line x1="640" y1="280" x2="-200" y2="720"/>
    <line x1="640" y1="280" x2="80" y2="720"/>
    <line x1="640" y1="280" x2="360" y2="720"/>
    <line x1="640" y1="280" x2="640" y2="720"/>
    <line x1="640" y1="280" x2="920" y2="720"/>
    <line x1="640" y1="280" x2="1200" y2="720"/>
    <line x1="640" y1="280" x2="1480" y2="720"/>
    <!-- Transverse Grid Lines -->
    <line x1="160" y1="420" x2="1120" y2="420"/>
    <line x1="0" y1="510" x2="1280" y2="510"/>
    <line x1="-120" y1="610" x2="1400" y2="610"/>
  </g>

  <!-- Background Cubicle Partitions (Isometric Silhouettes) -->
  <g opacity="0.4" fill="#0f1d2e" stroke="#1e3a5f" stroke-width="2">
    <polygon points="120,380 240,320 240,460 120,520"/>
    <polygon points="240,320 380,390 380,530 240,460"/>
    <polygon points="1040,320 1180,390 1180,530 1040,460"/>
    <polygon points="900,380 1040,320 1040,460 900,520"/>
  </g>

  <!-- Floating Urgent Notification Windows -->
  <g transform="translate(180, 200)" opacity="0.85" filter="url(#oe-shadow)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="24" rx="10" fill="#ef4444"/>
    <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">🚨 15 URGENT EMAILS</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">"Sync on Q3 deliverables?"</text>
  </g>

  <g transform="translate(900, 180)" opacity="0.85" filter="url(#oe-shadow)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="24" rx="10" fill="#f59e0b"/>
    <text x="10" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">⚠️ CALENDAR OVERLOAD</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Double booked: 4 meetings</text>
  </g>

  <!-- Central Modern Office Desk (Obstacle being leapt over) -->
  <g transform="translate(640, 520)" filter="url(#oe-shadow)">
    <!-- Desk Top -->
    <polygon points="-240,-40 240,-40 280,30 -280,30" fill="#0f2942" stroke="#00f0ff" stroke-width="4"/>
    <!-- Desk Side Panels -->
    <polygon points="-280,30 -240,-40 -240,110 -280,160" fill="#061320" stroke="#00f0ff" stroke-width="3"/>
    <polygon points="280,30 240,-40 240,110 280,160" fill="#061320" stroke="#00f0ff" stroke-width="3"/>

    <!-- Scattered Contracts / Documents Flying Off Desk -->
    <polygon points="-120,-30 -70,-50 -50,-15 -100,5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="120,-35 170,-20 155,10 105,-5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="-180,5 -140,-20 -125,5 -165,30" fill="#fef08a" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Glowing Laptop on Desk -->
    <polygon points="30,-30 90,-30 100,-10 20,-10" fill="#334155"/>
    <polygon points="30,-30 90,-30 90,-75 30,-75" fill="#0284c7" stroke="#38bdf8" stroke-width="2" filter="url(#oe-cyan)"/>
  </g>

  <!-- Speed Motion Lines behind Runner -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="280" y1="360" x2="480" y2="350"/>
    <line x1="240" y1="390" x2="450" y2="385" stroke-width="6"/>
    <line x1="300" y1="420" x2="500" y2="415"/>
  </g>

  <!-- Hero Corporate Runner (Mid-Air Desk Leap) -->
  <g transform="translate(620, 320)" filter="url(#oe-shadow)">
    <!-- Motion Shadow -->
    <ellipse cx="20" cy="190" rx="90" ry="20" fill="#020617" opacity="0.6"/>

    <!-- Suit Tie Flying Backwards -->
    <path d="M -15,-5 C -45,15 -75,25 -95,20 C -75,35 -45,25 -15,5 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>

    <!-- Runner Silhouette (Dynamic Leaping Sprinter in Business Suit) -->
    <!-- Head -->
    <circle cx="45" cy="-85" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Torso (Slim Suit Jacket) -->
    <path d="M 20,-60 L 65,-45 L 35,35 L -10,15 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>

    <!-- Forward Leaping Leg (Knee tucked high over desk) -->
    <path d="M 35,35 L 95,20 L 135,70" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoe -->
    <ellipse cx="140" cy="75" rx="18" ry="10" fill="#38bdf8"/>

    <!-- Back Leg (Extended straight back) -->
    <path d="M -10,15 L -85,55 L -140,85" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="-145" cy="90" rx="18" ry="10" fill="#38bdf8"/>

    <!-- Left Arm Clutching Glowing Coffee Mug (Primary Game Mechanic!) -->
    <path d="M 50,-40 L 95,-55 L 115,-30" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
    <!-- Coffee Mug -->
    <rect x="105" y="-50" width="30" height="34" rx="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" filter="url(#oe-cyan)"/>
    <path d="M 135,-42 C 145,-42 145,-28 135,-28" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- Steam Swirls -->
    <path d="M 115,-55 Q 112,-70 118,-80" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 125,-55 Q 128,-72 122,-82" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(640, 65)">
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#08121e" stroke="#00f0ff" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      OFFICE ESCAPE <tspan fill="#00f0ff">💼 CORPORATE RUN</tspan>
    </text>
  </g>
</svg>
