<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Left Fighter BG Gradient (Flame Crimson) -->
    <linearGradient id="fc-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Right Fighter BG Gradient (Cyber Electric Cyan) -->
    <linearGradient id="fc-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Impact Glow -->
    <filter id="fc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="fc-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Left Side: Fiery Martial Arts Arena -->
  <polygon points="0,0 760,0 520,720 0,720" fill="url(#fc-left)"/>

  <!-- Right Side: High-Tech Cyber Arena -->
  <polygon points="760,0 1280,0 1280,720 520,720" fill="url(#fc-right)"/>

  <!-- Diagonal Energy Slash Divider -->
  <line x1="760" y1="0" x2="520" y2="720" stroke="#ffffff" stroke-width="8" filter="url(#fc-glow)"/>
  <line x1="760" y1="0" x2="520" y2="720" stroke="#facc15" stroke-width="2"/>

  <!-- Speed Lines Left -->
  <g stroke="#fca5a5" stroke-width="3" opacity="0.4" stroke-dasharray="12 16">
    <line x1="0" y1="180" x2="480" y2="320"/>
    <line x1="0" y1="360" x2="450" y2="390"/>
    <line x1="0" y1="520" x2="490" y2="440"/>
  </g>

  <!-- Speed Lines Right -->
  <g stroke="#a5f3fc" stroke-width="3" opacity="0.4" stroke-dasharray="12 16">
    <line x1="1280" y1="180" x2="800" y2="320"/>
    <line x1="1280" y1="360" x2="830" y2="390"/>
    <line x1="1280" y1="520" x2="790" y2="440"/>
  </g>

  <!-- Left Fighter (Dragon Martial Artist) Silhouette & Flare -->
  <g transform="translate(340, 360)" filter="url(#fc-shadow)">
    <!-- Dragon Flame Aura -->
    <path d="M 50,-60 Q 180,-10 160,50 Q 80,10 0,80 Q 20,-10 50,-60 Z" fill="#fbbf24" opacity="0.85" filter="url(#fc-glow)"/>
    <path d="M 60,-40 Q 160,0 140,40 Q 70,10 20,60 Q 30,0 60,-40 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Martial Artist Silhouette (Striking Dragon Kick Pose) -->
    <!-- Head & Bandana Tails -->
    <circle cx="20" cy="-75" r="24" fill="#0f172a"/>
    <path d="M 5,-80 Q -40,-95 -70,-85 Q -35,-80 5,-70 Z" fill="#ef4444"/>
    <!-- Torso -->
    <path d="M 10,-55 L 75,-25 L 50,45 L -15,15 Z" fill="#0f172a"/>
    <!-- Flying Kick Extended Leg -->
    <path d="M 60,-15 L 185,-5 L 205,15 L 75,10 Z" fill="#0f172a"/>
    <polygon points="185,-5 225,5 205,25 175,10" fill="#dc2626"/>
    <!-- Guarding Arms -->
    <path d="M 30,-40 L -25,-20 L -30,-60" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
    <path d="M 45,-30 L 10,-5 L 0,-35" fill="none" stroke="#0f172a" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Right Fighter (Cyber Brawler) Silhouette & Electric Shield -->
  <g transform="translate(940, 370)" filter="url(#fc-shadow)">
    <!-- Hexagonal Kinetic Energy Shield -->
    <g transform="translate(-160, 0)" filter="url(#fc-glow)">
      <polygon points="0,-120 70,-60 70,60 0,120 -70,60 -70,-60" fill="none" stroke="#00f5ff" stroke-width="8"/>
      <polygon points="0,-90 50,-45 50,45 0,90 -50,45 -50,-45" fill="#00f5ff" opacity="0.2"/>
      <!-- Lightning Cracks on Shield -->
      <path d="M -20,-80 L 15,-30 L -10,10 L 25,70" fill="none" stroke="#ffffff" stroke-width="4"/>
    </g>

    <!-- Cyber Brawler Silhouette (Bracing / Blocking) -->
    <!-- Head / Cyber Visor -->
    <circle cx="-10" cy="-75" r="26" fill="#0f172a"/>
    <rect x="-35" y="-80" width="30" height="12" rx="4" fill="#00f5ff" filter="url(#fc-glow)"/>
    <!-- Heavily Armored Torso -->
    <path d="M -35,-50 L 35,-50 L 20,40 L -25,40 Z" fill="#0f172a"/>
    <!-- Bracing Heavy Arms -->
    <path d="M -30,-35 L -110,-35 L -125,-10" fill="none" stroke="#0f172a" stroke-width="20" stroke-linecap="round"/>
    <path d="M -15,-20 L -90,-20 L -105,5" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <!-- Sturdy Grounded Legs -->
    <path d="M -20,35 L -50,130 L -20,135" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <path d="M 15,35 L 55,125 L 85,130" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Point of Clashing Impact: Super Starburst -->
  <g transform="translate(640, 360)" filter="url(#fc-glow)">
    <polygon points="0,-160 30,-40 160,-20 40,30 80,160 -20,40 -160,30 -40,-20" fill="#ffffff"/>
    <polygon points="0,-90 18,-25 90,-10 25,18 45,90 -10,25 -90,18 -25,-10" fill="#facc15"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff"/>
  </g>

  <!-- Top Arcade HUD: Health Bars & VS Badge -->
  <g transform="translate(640, 60)">
    <!-- Left Health Bar -->
    <rect x="-420" y="-15" width="340" height="26" rx="6" fill="#1e1b4b" stroke="#ffffff" stroke-width="3"/>
    <rect x="-416" y="-12" width="280" height="20" rx="4" fill="#ef4444"/>
    <!-- Right Health Bar -->
    <rect x="80" y="-15" width="340" height="26" rx="6" fill="#1e1b4b" stroke="#ffffff" stroke-width="3"/>
    <rect x="140" y="-12" width="276" height="20" rx="4" fill="#00f5ff"/>

    <!-- Center VS Emblem -->
    <polygon points="-50,-30 50,-30 35,30 -35,30" fill="#facc15" stroke="#000000" stroke-width="4"/>
    <text x="0" y="12" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#000000" text-anchor="middle" font-style="italic">VS</text>
  </g>
</svg>
