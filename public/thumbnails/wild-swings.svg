<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Kinetic Neon Gradient Background -->
    <linearGradient id="ws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="40%" stop-color="#190d38"/>
      <stop offset="80%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0d041e"/>
    </linearGradient>

    <!-- Neon Cyan Glow -->
    <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Pink Glow -->
    <filter id="neon-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="ws-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#a855f7" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#ws-bg)"/>
  <rect width="1280" height="720" fill="url(#ws-grid)"/>

  <!-- Pendulum Motion Trajectory Path (Dashed Arc) -->
  <path d="M 320,540 C 360,620 540,640 700,520 C 820,420 950,320 1060,260"
        fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 14" opacity="0.45"/>

  <!-- Glowing Anchor Pivot Node (Top Center-Left) -->
  <g transform="translate(480, 180)">
    <!-- Pulse Waves -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.7"/>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="22" fill="#06b6d4" filter="url(#neon-cyan)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>

  <!-- Glowing Elastic Grapple Rope -->
  <line x1="480" y1="180" x2="680" y2="440" stroke="#00f5ff" stroke-width="6" filter="url(#neon-cyan)"/>
  <line x1="480" y1="180" x2="680" y2="440" stroke="#ffffff" stroke-width="2"/>

  <!-- Checkered Target Finish Ring (Right Side) -->
  <g transform="translate(1080, 240)" filter="url(#neon-pink)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ec4899" stroke-width="6" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#f43f5e" stroke-width="12" stroke-dasharray="24 24"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Center Pass Portal -->
    <circle cx="0" cy="0" r="50" fill="#f43f5e" opacity="0.25"/>
    <text x="0" y="8" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="2">GOAL</text>
  </g>

  <!-- Acrobat Stickman Character (Mid-Air Kinetic Backflip Swing) -->
  <g transform="translate(680, 440) rotate(-28)">
    <!-- Hands gripping hook -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#neon-cyan)"/>
    
    <!-- Arms -->
    <path d="M 0,0 L 25,35" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0,0 L 40,30" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="65" cy="18" r="22" fill="#ffffff" filter="url(#neon-cyan)"/>

    <!-- Torso / Spine Arc -->
    <path d="M 30,35 Q 20,70 0,95" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- Kinetic Aerodynamic Legs in Mid-Air Acrobat Tuck -->
    <!-- Left Leg (tucked forward) -->
    <path d="M 0,95 L -35,75 L -65,100" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Leg (extended trail) -->
    <path d="M 0,95 L -20,135 L -55,160" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Motion Particles -->
    <circle cx="-70" cy="140" r="6" fill="#00f5ff" opacity="0.8"/>
    <circle cx="-95" cy="120" r="4" fill="#38bdf8" opacity="0.6"/>
    <circle cx="-110" cy="90" r="5" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- Clean Graphic Designer Title Badge -->
  <g transform="translate(640, 65)">
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#0f0728" stroke="#00f5ff" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      WILD SWINGS <tspan fill="#00f5ff">🕸️ HOOK &amp; FLIGHT</tspan>
    </text>
  </g>
</svg>
