<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pop Up: Balloon Blitz 🎈💥 — krazio games</title>
    <!-- Favicon -->
    <link rel="icon" href="krazio-icon.svg" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        (function() {
            if (window.parent !== window || window.location.search.includes('embedded=true')) {
                document.documentElement.classList.add('is-embedded');
                document.addEventListener('DOMContentLoaded', () => document.body && document.body.classList.add('is-embedded'));
            }
            function exitToPortal() {
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'EXIT_TO_PORTAL' }, '*');
                } else {
                    window.location.href = '../index.html';
                }
            }
            window.exitToPortal = exitToPortal;
            document.addEventListener('click', function(e) {
                const a = e.target.closest('a');
                if (a) {
                    const href = a.getAttribute('href');
                    if (href && (href.includes('index.html') || href === '/' || href === '../' || href === '../index.html')) {
                        e.preventDefault();
                        e.stopPropagation();
                        exitToPortal();
                        return false;
                    }
                }
            }, true);
        })();
    </script>
    <style>
      #krazio-floating-back {
        position: fixed;
        top: 14px;
        left: 16px;
        z-index: 99999;
        width: 40px;
        height: 40px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f8fafc;
        border-radius: 50%;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.2s ease;
        cursor: pointer;
      }
      #krazio-floating-back:hover {
        background: rgba(249, 115, 22, 0.9);
        border-color: #f97316;
        color: #ffffff;
        transform: translateX(-3px) scale(1.08);
        box-shadow: 0 6px 20px rgba(249, 115, 22, 0.6);
      }
    </style>
  </head>
  <body>
    <!-- Simple Backward Arrow Button -->
    <a href="../index.html" id="krazio-floating-back" title="Back to Portal" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
