<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Cavern Gradient -->
    <linearGradient id="gf-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Teal Glow -->
    <filter id="gf-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="crystal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <linearGradient id="purple-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#gf-bg)"/>

  <!-- Top Cavern Ceiling & Stalactites -->
  <rect x="0" y="0" width="1280" height="90" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
  <!-- Glowing Neon Ceiling Runner Rail -->
  <line x1="0" y1="90" x2="1280" y2="90" stroke="#00f5ff" stroke-width="6" filter="url(#gf-glow)"/>

  <!-- Sharp Stalactites Hanging Down -->
  <polygon points="120,90 160,240 200,90" fill="url(#crystal-grad)" filter="url(#gf-glow)"/>
  <polygon points="145,90 160,240 175,90" fill="#cffafe"/>
  <polygon points="340,90 370,190 400,90" fill="url(#purple-crystal)"/>
  <polygon points="820,90 860,260 900,90" fill="url(#crystal-grad)" filter="url(#gf-glow)"/>
  <polygon points="845,90 860,260 875,90" fill="#cffafe"/>
  <polygon points="1040,90 1070,200 1100,90" fill="url(#purple-crystal)"/>

  <!-- Bottom Cavern Floor & Stalagmites -->
  <rect x="0" y="630" width="1280" height="90" fill="#0f172a" stroke="#1e293b" stroke-width="4"/>
  <!-- Glowing Neon Floor Runner Rail -->
  <line x1="0" y1="630" x2="1280" y2="630" stroke="#00f5ff" stroke-width="6" filter="url(#gf-glow)"/>

  <!-- Stalagmites Rising Up -->
  <polygon points="240,630 270,480 300,630" fill="url(#crystal-grad)" filter="url(#gf-glow)"/>
  <polygon points="260,630 270,480 280,630" fill="#cffafe"/>
  <polygon points="620,630 650,520 680,630" fill="url(#purple-crystal)"/>
  <polygon points="940,630 980,450 1020,630" fill="url(#crystal-grad)" filter="url(#gf-glow)"/>
  <polygon points="965,630 980,450 995,630" fill="#cffafe"/>

  <!-- Giant Holographic Gravity Inversion Chevrons in Background -->
  <g transform="translate(640, 360)" filter="url(#gf-glow)" opacity="0.35">
    <polygon points="0,-160 80,-80 40,-80 40,-10 -40,-10 -40,-80 -80,-80" fill="#00f5ff"/>
    <polygon points="0,160 80,80 40,80 40,10 -40,10 -40,80 -80,80" fill="#c084fc"/>
  </g>

  <!-- Laser Beam Barrier Warning -->
  <line x1="780" y1="90" x2="780" y2="630" stroke="#ef4444" stroke-width="5" stroke-dasharray="16 16" filter="url(#gf-glow)"/>
  <circle cx="780" cy="90" r="12" fill="#ef4444"/>
  <circle cx="780" cy="630" r="12" fill="#ef4444"/>

  <!-- Top Inverted Runner (Running on Ceiling Upside-Down!) -->
  <g transform="translate(540, 95) scale(1, -1)">
    <!-- Motion Trails -->
    <path d="M -80,10 L -140,10 M -90,30 L -160,30" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <!-- Runner Body (Upside Down Sprinter) -->
    <!-- Head -->
    <circle cx="45" cy="75" r="16" fill="#00f5ff" filter="url(#gf-glow)"/>
    <circle cx="45" cy="75" r="9" fill="#ffffff"/>
    <!-- Torso -->
    <line x1="40" y1="60" x2="10" y2="25" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="30" y1="50" x2="60" y2="35" stroke="#00f5ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="5" y2="65" stroke="#00f5ff" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs Running on Ceiling Rail -->
    <path d="M 10,25 L 30,5 L 50,0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M 10,25 L -15,15 L -35,0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Gravity Inversion Particle Swirl (Center Action) -->
  <g transform="translate(480, 360)" filter="url(#gf-glow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#00f5ff" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M -20,-20 Q 0,-40 20,-20 Q 40,0 20,20 Q 0,40 -20,20 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(640, 50)">
    <rect x="-240" y="-28" width="480" height="56" rx="28" fill="#0f172a" stroke="#00f5ff" stroke-width="4" opacity="0.95"/>
    <text x="0" y="9" font-family="'Impact', 'Arial Black', sans-serif" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      GRAVITY FLIP <tspan fill="#00f5ff">🔄 CAVERN RUNNER</tspan>
    </text>
  </g>
</svg>
