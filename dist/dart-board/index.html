<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <base href="/dart-board/">
    <link rel="icon" href="krazio-icon.svg" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
      #krazio-floating-back {
        position: fixed;
        top: 14px;
        left: 16px;
        z-index: 99999;
        width: 40px;
        height: 40px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f8fafc;
        border-radius: 50%;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.2s ease;
        cursor: pointer;
      }
      #krazio-floating-back:hover {
        background: rgba(249, 115, 22, 0.9);
        border-color: #f97316;
        color: #ffffff;
        transform: translateX(-3px) scale(1.08);
        box-shadow: 0 6px 20px rgba(249, 115, 22, 0.6);
      }
    </style>
    <style>
        :root {
            --wall-color-you: #e07a67;
            --wall-stripe-you: #d96f5b;
            --wall-color-bot: #5b9eb8;
            --wall-stripe-bot: #4f91aa;
            --floor-color: #8c4c3b;
            --floor-stripe: #7b3e2e;
            --you-color: #ff4757;
            --bot-color: #2ed573;
            --rival-blue: #00d2d3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0f19;
            font-family: 'Fredoka', 'Outfit', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fullscreen Responsive Arena for Laptop & Desktop */
        #gameApp {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                90deg,
                var(--wall-color-you) 0px,
                var(--wall-color-you) 50px,
                var(--wall-stripe-you) 50px,
                var(--wall-stripe-you) 100px
            );
            transition: background 0.6s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #gameApp.turn-bot {
            background: repeating-linear-gradient(
                90deg,
                var(--wall-color-bot) 0px,
                var(--wall-color-bot) 50px,
                var(--wall-stripe-bot) 50px,
                var(--wall-stripe-bot) 100px
            );
        }

        /* Wooden Floor at bottom */
        .room-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 18%;
            background: repeating-linear-gradient(
                90deg,
                var(--floor-color) 0px,
                var(--floor-color) 60px,
                var(--floor-stripe) 60px,
                var(--floor-stripe) 120px
            );
            border-top: 12px solid #5a2c20;
            z-index: 1;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Top HUD Bar */
        .top-hud {
            position: absolute;
            top: 24px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            z-index: 30;
        }

        .hud-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(45, 52, 54, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, background 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .hud-btn:hover {
            transform: scale(1.08);
            background: rgba(45, 52, 54, 0.8);
        }

        .hud-btn:active {
            transform: scale(0.95);
        }

        /* Score Pill Center */
        .score-pill-container {
            display: flex;
            align-items: center;
            background: rgba(30, 39, 46, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
            padding: 6px 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .score-pill-container:hover {
            transform: scale(1.03);
        }

        .score-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .score-side-label {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
        }

        .score-side-val {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .score-you .score-side-val { color: #ff5252; }
        .score-bot .score-side-val { color: #00d2d3; }

        .score-vs-divider {
            margin: 0 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-vs-text {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            border-bottom: 2px solid #fff;
            padding: 0 4px;
        }

        /* Canvas Stage */
        .canvas-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: crosshair;
            touch-action: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Turn Indicator Pill at bottom */
        .turn-banner {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            z-index: 25;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* Help Icon Button */
        .btn-help {
            position: absolute;
            bottom: 22%;
            left: 36px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(45, 52, 54, 0.55);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            backdrop-filter: blur(8px);
        }

        /* Throw Tip Banner */
        .throw-tip {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 24px;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 800;
            z-index: 30;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .throw-tip span {
            color: #fbc531;
        }

        /* Mode & Settings Modal */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 24px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #1e293b;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            color: #fff;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: #fbc531;
        }

        .modal-sub {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .mode-button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .mode-choice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 18px;
            color: #fff;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .mode-choice-btn.active {
            background: #ff4757;
            border-color: #ff6b81;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
        }

        .score-choice-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 26px;
        }

        .score-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
        }

        .score-btn.active {
            background: #2ed573;
            border-color: #7bed9f;
        }

        .btn-start-game {
            width: 100%;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            color: #2f3640;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(251, 197, 49, 0.4);
            transition: transform 0.15s ease;
        }

        .btn-start-game:hover {
            transform: scale(1.03);
        }

        .result-title.win {
            color: #fbc531;
            text-shadow: 0 0 25px rgba(251, 197, 49, 0.6);
        }

        .result-title.lose {
            color: #ff4757;
            text-shadow: 0 0 25px rgba(255, 71, 87, 0.6);
        }
    </style>
</head>
<body>

    <!-- Simple Backward Arrow Button -->
    <a href="../index.html" id="krazio-floating-back" title="Back to Portal" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>

    <div id="gameApp">
        <!-- Top HUD -->
        <header class="top-hud">
            <button class="hud-btn" id="btnOpenMenu" title="Home Menu & Game Settings">📋</button>

            <div class="score-pill-container" id="scorePillHUD" title="Current Score">
                <div class="score-side score-you">
                    <span class="score-side-label" id="p1Label">YOU</span>

                <div class="score-side score-bot">

        <div class="modal-overlay" id="resultModal">

                <h2 class="modal-title" id="resultTitle" style="font-size: 2.2rem;">YOU WIN! 🏆</h2>
                <p class="modal-sub" id="resultSub" style="font-size: 0.95rem; color: #a4b0be;">You reached 0 points first!</p>

                <div style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 14px; margin: 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <div style="font-size: 0.8rem; color: #a4b0be; font-weight: 800;">YOU</div>

                        <div style="font-size: 0.8rem; color: #a4b0be; font-weight: 800;" id="resP2Name">BOT</div>

                <div style="display: flex; flex-direction: column; gap: 10px;">

                        <span>🏠 MAIN MENU (HOME)</span>
                    </button>
                    <a href="../index.html" class="mode-choice-btn" style="text-decoration: none; justify-content: center; font-size: 1rem; border-color: rgba(99, 102, 241, 0.4); color: #818cf8;">

    <!-- Self-Contained Complete Dart Arcade Engine -->
    <script>
    (function() {
        'use strict';

        // Web Audio Synthesizer
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playThrow() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.16);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);
            }
            playHit(isBull = false) {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isBull ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isBull ? 260 : 160, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.14);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);

                if (isBull) {
                    const bell = this.ctx.createOscillator();
                    const bGain = this.ctx.createGain();
                    bell.type = 'sine';
                    bell.frequency.setValueAtTime(880, now + 0.02);
                    bell.frequency.exponentialRampToValueAtTime(1320, now + 0.3);
                    bGain.gain.setValueAtTime(0.3, now + 0.02);
                    bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    bell.connect(bGain);
                    bGain.connect(this.ctx.destination);
                    bell.start(now + 0.02);
                    bell.stop(now + 0.3);
                }
            }
        }

        const audio = new SoundEngine();

        // 20 Sector Ordering (London standard clockwise from top 20)
        const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
        const ANGLE_SLICE = (Math.PI * 2) / 20;

        class OfflineDartsGame {
            constructor() {
                this.app = document.getElementById('gameApp');
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.width = window.innerWidth;
                this.height = window.innerHeight;

                // Board Configuration
                this.board = {
                    x: this.width / 2,
                    y: this.height * 0.38,
                    r: 160,
                    rInnerBull: 8,
                    rOuterBull: 19,
                    rTrebleIn: 86,
                    rTrebleOut: 100,
                    rDoubleIn: 146,
                    rDoubleOut: 160
                };

                // Dual Aim Sliders (Comfortable readable timing speed)
                this.sliderV = {
                    x: 0,
                    y: 0,
                    w: 12,
                    h: 220,
                    val: 0.5,
                    speed: 0.011, // Smooth timing speed
                    dir: 1
                };

                this.sliderH = {
                    x: 0,
                    y: 0,
                    w: 220,
                    h: 12,
                    val: 0.5,
                    speed: 0.013, // Smooth timing speed
                    dir: 1
                };

                // Dynamic Camera Zoom System
                this.camera = {
                    zoom: 1,
                    targetZoom: 1,
                    focusX: this.board.x,
                    focusY: this.board.y,
                    targetFocusX: this.board.x,
                    targetFocusY: this.board.y
                };

                // Game State (1-by-1 alternating turns)
                this.gameMode = 'bot';
                this.startScore = 301;
                this.p1 = { score: 301, name: 'YOU', color: '#ff4757', darts: [] };
                this.p2 = { score: 301, name: 'BOT', color: '#00d2d3', darts: [] };
                this.turn = 0; // 0 = P1, 1 = P2
                this.turnThrowsLeft = 1;
                this.flyingDart = null;
                this.landedDarts = [];
                this.floatingPopups = [];
                this.gameOver = false;

                // 0 = Both oscillating, 1 = H locked, 2 = V locked & throw
                this.meterStep = 0;

                this.resizeCanvas();
                this.setupEvents();
                this.updateUI();
                this.loop();
            }

            resizeCanvas() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;

                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.canvas.style.width = `${this.width}px`;
                this.canvas.style.height = `${this.height}px`;

                this.board.x = this.width / 2;
                this.board.y = this.height * 0.38;
                this.board.r = Math.min(this.width * 0.22, this.height * 0.25, 175);
                this.board.rInnerBull = this.board.r * 0.052;
                this.board.rOuterBull = this.board.r * 0.12;
                this.board.rTrebleIn = this.board.r * 0.54;
                this.board.rTrebleOut = this.board.r * 0.63;
                this.board.rDoubleIn = this.board.r * 0.91;
                this.board.rDoubleOut = this.board.r * 1.0;

                // Sliders positioned relative to dartboard
                this.sliderV.x = this.board.x - this.board.r - 45;
                this.sliderV.y = this.board.y - this.board.r;
                this.sliderV.w = 10;
                this.sliderV.h = this.board.r * 2;

                this.sliderH.x = this.board.x - this.board.r * 0.85;
                this.sliderH.y = this.board.y + this.board.r + 42;
                this.sliderH.w = this.board.r * 1.7;
                this.sliderH.h = 10;

                this.camera.focusX = this.board.x;
                this.camera.focusY = this.board.y;
                this.camera.targetFocusX = this.board.x;
                this.camera.targetFocusY = this.board.y;
            }

            setupEvents() {
                window.addEventListener('resize', () => this.resizeCanvas());

                const handleTap = (e) => {
                    if (this.gameOver || this.flyingDart || (this.turn === 1 && this.gameMode === 'bot')) return;
                    audio.init();

                    if (this.meterStep === 0) {
                        this.meterStep = 1;
                    } else if (this.meterStep === 1) {
                        this.meterStep = 0;
                        this.triggerPlayerThrow();
                    }
                };

                this.canvas.addEventListener('pointerdown', handleTap);

                const btnRestart = document.getElementById('btnRestart');
                if (btnRestart) btnRestart.addEventListener('click', () => this.resetMatch());

                const btnOpenMenu = document.getElementById('btnOpenMenu');
                const btnHelp = document.getElementById('btnHelp');
                const modal = document.getElementById('modalOverlay');
                const btnStartGame = document.getElementById('btnStartGame');

                const resultModal = document.getElementById('resultModal');
                const btnResultPlayAgain = document.getElementById('btnResultPlayAgain');
                const btnResultHome = document.getElementById('btnResultHome');

                if (btnOpenMenu && modal) {
                    btnOpenMenu.addEventListener('click', () => {
                        if (resultModal) resultModal.classList.remove('active');
                        modal.classList.add('active');
                    });
                }
                if (btnHelp && modal) {
                    btnHelp.addEventListener('click', () => {
                        if (resultModal) resultModal.classList.remove('active');
                        modal.classList.add('active');
                    });
                }

                function ensureFullScreen() {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                        const el = document.documentElement;
                        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                        if (req) req.call(el).catch(() => {});
                    }
                }

                if (btnResultPlayAgain) {
                    btnResultPlayAgain.addEventListener('click', () => {
                        ensureFullScreen();
                        if (resultModal) resultModal.classList.remove('active');
                        this.resetMatch();
                    });
                }

                if (btnResultHome) {
                    btnResultHome.addEventListener('click', () => {
                        if (resultModal) resultModal.classList.remove('active');
                        if (modal) modal.classList.add('active');
                    });
                }

                const modeBtns = document.querySelectorAll('.mode-choice-btn');
                modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        modeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.gameMode = btn.getAttribute('data-mode');
                    });
                });

                const scoreBtns = document.querySelectorAll('.score-btn');
                scoreBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        scoreBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.startScore = parseInt(btn.getAttribute('data-score'), 10) || 301;
                    });
                });

                if (btnStartGame && modal) {
                    btnStartGame.addEventListener('click', () => {
                        ensureFullScreen();
                        modal.classList.remove('active');
                        if (resultModal) resultModal.classList.remove('active');
                        this.resetMatch();
                    });
                }
            }

            resetMatch() {
                this.p1.score = this.startScore;
                this.p2.score = this.startScore;
                this.p1.darts = [];
                this.p2.darts = [];
                this.landedDarts = [];
                this.floatingPopups = [];
                this.turn = 0;
                this.turnThrowsLeft = 1;
                this.gameOver = false;
                this.flyingDart = null;
                this.meterStep = 0;
                this.camera.targetZoom = 1;
                const resultModal = document.getElementById('resultModal');
                if (resultModal) resultModal.classList.remove('active');
                this.updateUI();
            }

            triggerPlayerThrow() {
                const targetX = this.board.x + (this.sliderH.val - 0.5) * (this.board.r * 2.2);
                const targetY = this.board.y + (this.sliderV.val - 0.5) * (this.board.r * 2.2);

                this.launchDart(targetX, targetY);
            }

            triggerBotThrow() {
                if (this.gameOver || this.turn !== 1 || this.gameMode !== 'bot') return;

                setTimeout(() => {
                    if (this.gameOver || this.turn !== 1) return;

                    const targetSectorAngle = -Math.PI / 2;
                    const trebleR = (this.board.rTrebleIn + this.board.rTrebleOut) / 2;
                    const aimX = this.board.x + Math.cos(targetSectorAngle) * trebleR + (Math.random() - 0.5) * 40;
                    const aimY = this.board.y + Math.sin(targetSectorAngle) * trebleR + (Math.random() - 0.5) * 40;

                    this.launchDart(aimX, aimY);
                }, 900);
            }

            launchDart(targetX, targetY) {
                audio.playThrow();
                const startX = this.width / 2;
                const startY = this.height * 0.85;

                this.flyingDart = {
                    startX,
                    startY,
                    targetX,
                    targetY,
                    x: startX,
                    y: startY,
                    t: 0,
                    speed: 0.055,
                    isBot: this.turn === 1 && this.gameMode === 'bot'
                };
            }

            scoreHit(x, y) {
                const dx = x - this.board.x;
                const dy = y - this.board.y;
                const dist = Math.hypot(dx, dy);

                let angle = Math.atan2(dy, dx) - (-Math.PI / 2);
                if (angle < 0) angle += Math.PI * 2;

                const sectorIdx = Math.floor((angle + ANGLE_SLICE / 2) / ANGLE_SLICE) % 20;
                const baseNum = SECTORS[sectorIdx];

                let points = 0;
                let isBull = false;
                let label = 'MISS (0 PTS)';
                let badge = 'MISS';

                if (dist <= this.board.rInnerBull) {
                    points = 50;
                    isBull = true;
                    label = '+50 BULLSEYE! 🎯';
                    badge = 'BULLSEYE 50';
                } else if (dist <= this.board.rOuterBull) {
                    points = 25;
                    isBull = true;
                    label = '+25 OUTER BULL 🎯';
                    badge = 'BULL 25';
                } else if (dist > this.board.rTrebleIn && dist <= this.board.rTrebleOut) {
                    points = baseNum * 3;
                    label = `+${points} TRIPLE ${baseNum}! 🔥`;
                    badge = `TRIPLE ${baseNum}`;
                } else if (dist > this.board.rDoubleIn && dist <= this.board.rDoubleOut) {
                    points = baseNum * 2;
                    label = `+${points} DOUBLE ${baseNum}! ⚡`;
                    badge = `DOUBLE ${baseNum}`;
                } else if (dist <= this.board.rDoubleOut) {
                    points = baseNum;
                    label = `+${points} SINGLE ${baseNum}`;
                    badge = `SINGLE ${baseNum}`;
                } else {
                    points = 0;
                    label = 'MISS (0 PTS)';
                    badge = 'OUT OF BOARD';
                }

                return { points, isBull, label, badge, x, y };
            }

            onDartLanded(hit) {
                audio.playHit(hit.isBull);
                const activePlayer = this.turn === 0 ? this.p1 : this.p2;

                this.landedDarts.push({
                    x: hit.x,
                    y: hit.y,
                    color: activePlayer.color,
                    isBot: this.turn === 1
                });

                // Spawn floating score earned popup on the board
                this.floatingPopups.push({
                    x: hit.x,
                    y: hit.y - 12,
                    text: hit.label,
                    badge: hit.badge,
                    points: hit.points,
                    color: hit.points > 0 ? (hit.isBull ? '#fbbf24' : (hit.points >= 40 ? '#00f0ff' : '#2ed573')) : '#ef4444',
                    life: 85,
                    maxLife: 85,
                    vy: -1.4,
                    scale: 0.25
                });

                // Camera Zoom into Impact Spot
                this.camera.targetZoom = 1.45;
                this.camera.targetFocusX = hit.x;
                this.camera.targetFocusY = hit.y;

                activePlayer.score = Math.max(0, activePlayer.score - hit.points);
                this.turnThrowsLeft--;
                this.updateUI();

                const turnBanner = document.getElementById('turnBanner');
                if (turnBanner) {
                    turnBanner.textContent = `${activePlayer.name}: ${hit.label}`;
                }

                if (activePlayer.score === 0) {
                    this.gameOver = true;
                    this.showGameResult(activePlayer);
                    return;
                }

                // 1-by-1 alternating turns: immediately switch to next player
                setTimeout(() => {
                    this.camera.targetZoom = 1.0;
                    this.camera.targetFocusX = this.board.x;
                    this.camera.targetFocusY = this.board.y;

                    if (!this.gameOver) {
                        this.turn = this.turn === 0 ? 1 : 0;
                        this.turnThrowsLeft = 1;
                        if (this.landedDarts.length > 3) {
                            this.landedDarts = this.landedDarts.slice(-3);
                        }
                        this.updateUI();

                        if (this.turn === 1 && this.gameMode === 'bot') {
                            this.triggerBotThrow();
                        }
                    }
                }, 950);
            }

            showGameResult(winner) {
                const turnBanner = document.getElementById('turnBanner');
                const resultModal = document.getElementById('resultModal');
                const resultTitle = document.getElementById('resultTitle');
                const resultSub = document.getElementById('resultSub');
                const resP1Score = document.getElementById('resP1Score');
                const resP2Score = document.getElementById('resP2Score');
                const resP2Name = document.getElementById('resP2Name');

                if (resP1Score) resP1Score.textContent = this.p1.score;
                if (resP2Score) resP2Score.textContent = this.p2.score;
                if (resP2Name) resP2Name.textContent = this.p2.name;

                if (this.gameMode === 'bot') {
                    if (winner === this.p1) {
                        if (resultTitle) {
                            resultTitle.textContent = 'YOU WIN! 🏆';
                            resultTitle.className = 'modal-title result-title win';
                        }
                        if (resultSub) resultSub.textContent = 'Outstanding darts! You reached 0 first and defeated the Bot!';
                        if (turnBanner) turnBanner.textContent = '🏆 YOU WIN! 🏆';
                    } else {
                        if (resultTitle) {
                            resultTitle.textContent = 'YOU LOSE! 💀';
                            resultTitle.className = 'modal-title result-title lose';
                        }
                        if (resultSub) resultSub.textContent = 'The Bot reached 0 points first! Better luck next match!';
                        if (turnBanner) turnBanner.textContent = '💀 BOT WINS! 💀';
                    }
                } else if (this.gameMode === 'pass') {
                    if (resultTitle) {
                        resultTitle.textContent = `🏆 ${winner.name} WINS! 🏆`;
                        resultTitle.className = 'modal-title result-title win';
                    }
                    if (resultSub) resultSub.textContent = `Match completed! ${winner.name} is the Dart Champion!`;
                    if (turnBanner) turnBanner.textContent = `🏆 ${winner.name} WINS! 🏆`;
                } else {
                    if (resultTitle) {
                        resultTitle.textContent = `🏆 ${winner.name} VICTORIOUS! 🏆`;
                        resultTitle.className = 'modal-title result-title win';
                    }
                    if (resultSub) resultSub.textContent = 'Multiplayer Arena champion!';
                    if (turnBanner) turnBanner.textContent = `🏆 ${winner.name} WINS! 🏆`;
                }

                setTimeout(() => {
                    this.camera.targetZoom = 1.0;
                    this.camera.targetFocusX = this.board.x;
                    this.camera.targetFocusY = this.board.y;
                    if (resultModal) resultModal.classList.add('active');
                }, 800);
            }

            updateUI() {
                const p1ScoreEl = document.getElementById('p1Score');
                const p2ScoreEl = document.getElementById('p2Score');
                const p1Label = document.getElementById('p1Label');
                const p2Label = document.getElementById('p2Label');
                const turnBanner = document.getElementById('turnBanner');

                if (p1ScoreEl) p1ScoreEl.textContent = this.p1.score;
                if (p2ScoreEl) p2ScoreEl.textContent = this.p2.score;

                if (this.gameMode === 'pass') {
                    p2Label.textContent = 'P2';
                } else if (this.gameMode === 'multiplayer') {
                    p2Label.textContent = 'RIVAL';
                } else {
                    p2Label.textContent = 'BOT';
                }

                if (this.turn === 0) {
                    this.app.classList.remove('turn-bot');
                    turnBanner.textContent = 'YOUR TURN';
                } else {
                    this.app.classList.add('turn-bot');
                    turnBanner.textContent = this.gameMode === 'bot' ? 'BOTS TURN' : 'PLAYER 2 TURN';
                }
            }

            updateMeters() {
                if (this.meterStep === 0) {
                    this.sliderH.val += this.sliderH.speed * this.sliderH.dir;
                    if (this.sliderH.val >= 1) { this.sliderH.val = 1; this.sliderH.dir = -1; }
                    if (this.sliderH.val <= 0) { this.sliderH.val = 0; this.sliderH.dir = 1; }
                }

                if (this.meterStep === 0 || this.meterStep === 1) {
                    this.sliderV.val += this.sliderV.speed * this.sliderV.dir;
                    if (this.sliderV.val >= 1) { this.sliderV.val = 1; this.sliderV.dir = -1; }
                    if (this.sliderV.val <= 0) { this.sliderV.val = 0; this.sliderV.dir = 1; }
                }
            }

            drawSliders() {
                const ctx = this.ctx;

                // Vertical Slider
                const sv = this.sliderV;
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(sv.x, sv.y, sv.w, sv.h, 5);
                ctx.fillStyle = 'rgba(45, 52, 54, 0.45)';
                ctx.fill();

                const knobY = sv.y + sv.val * sv.h;
                ctx.beginPath();
                ctx.roundRect(sv.x - 8, knobY - 5, sv.w + 16, 10, 5);
                ctx.fillStyle = '#2d3436';
                ctx.fill();
                ctx.restore();

                // Horizontal Slider
                const sh = this.sliderH;
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(sh.x, sh.y, sh.w, sh.h, 5);
                ctx.fillStyle = 'rgba(45, 52, 54, 0.45)';
                ctx.fill();

                const knobX = sh.x + sh.val * sh.w;
                ctx.beginPath();
                ctx.roundRect(knobX - 5, sh.y - 8, 10, sh.h + 16, 5);
                ctx.fillStyle = '#2d3436';
                ctx.fill();
                ctx.restore();

                // Projected Target Dot on Dartboard
                if (!this.flyingDart && this.camera.zoom < 1.15) {
                    const targetX = this.board.x + (this.sliderH.val - 0.5) * (this.board.r * 2.2);
                    const targetY = this.board.y + (this.sliderV.val - 0.5) * (this.board.r * 2.2);
                    const isBot = this.turn === 1 && this.gameMode === 'bot';

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 7, 0, Math.PI * 2);
                    ctx.fillStyle = isBot ? 'rgba(0, 210, 211, 0.85)' : 'rgba(255, 71, 87, 0.85)';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                    ctx.restore();
                }
            }

            drawDartboard() {
                const ctx = this.ctx;
                const b = this.board;

                ctx.save();

                // Drop shadow
                ctx.beginPath();
                ctx.arc(b.x + 10, b.y + 14, b.r + 18, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fill();

                // Outer Black Number Ring
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r + 18, 0, Math.PI * 2);
                ctx.fillStyle = '#1e272e';
                ctx.fill();

                // 20 Alternating Sectors
                for (let i = 0; i < 20; i++) {
                    const startA = -Math.PI / 2 + (i - 0.5) * ANGLE_SLICE;
                    const endA = startA + ANGLE_SLICE;
                    const isEven = i % 2 === 0;

                    // Single segment
                    ctx.beginPath();
                    ctx.moveTo(b.x, b.y);
                    ctx.arc(b.x, b.y, b.rDoubleOut, startA, endA);
                    ctx.closePath();
                    ctx.fillStyle = isEven ? '#18181b' : '#f8f9fa';
                    ctx.fill();

                    // Double Ring
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.rDoubleOut, startA, endA);
                    ctx.arc(b.x, b.y, b.rDoubleIn, endA, startA, true);
                    ctx.closePath();
                    ctx.fillStyle = isEven ? '#eb4d4b' : '#2ed573';
                    ctx.fill();

                    // Treble Ring
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.rTrebleOut, startA, endA);
                    ctx.arc(b.x, b.y, b.rTrebleIn, endA, startA, true);
                    ctx.closePath();
                    ctx.fillStyle = isEven ? '#eb4d4b' : '#2ed573';
                    ctx.fill();
                }

                // Outer Bull (Green 25)
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.rOuterBull, 0, Math.PI * 2);
                ctx.fillStyle = '#2ed573';
                ctx.fill();

                // Inner Bull (Red 50 with white ring)
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.rInnerBull + 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.rInnerBull, 0, Math.PI * 2);
                ctx.fillStyle = '#eb4d4b';
                ctx.fill();

                // Numbers Ring
                ctx.font = `900 ${Math.round(b.r * 0.12)}px Outfit, sans-serif`;
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (let i = 0; i < 20; i++) {
                    const a = -Math.PI / 2 + i * ANGLE_SLICE;
                    const nx = b.x + Math.cos(a) * (b.r + 9);
                    const ny = b.y + Math.sin(a) * (b.r + 9);
                    ctx.fillText(SECTORS[i], nx, ny);
                }

                ctx.restore();
            }

            drawStylizedDart(x, y, scale = 1, isBot = false, shadow = true) {
                const ctx = this.ctx;
                ctx.save();
                ctx.translate(x, y);
                ctx.scale(scale, scale);

                const flightPrimary = isBot ? '#06b6d4' : '#ef4444';
                const flightAccent = isBot ? '#a5f3fc' : '#fef08a';
                const barrelMetal = isBot ? '#38bdf8' : '#f59e0b';

                // 1. Realistic Soft 3D Drop Shadow
                if (shadow) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.ellipse(10, 18, 14, 7, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
                    ctx.filter = 'blur(2px)';
                    ctx.fill();
                    ctx.restore();
                }

                // 2. Aerodynamic 3D Flight Fins (4-Fin Perspective)
                // Left & Right Outer Wings
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(-4, 0);
                ctx.lineTo(-24, -8);
                ctx.lineTo(-30, 32);
                ctx.lineTo(0, 18);
                ctx.lineTo(30, 32);
                ctx.lineTo(24, -8);
                ctx.lineTo(4, 0);
                ctx.closePath();

                const flightGrad = ctx.createLinearGradient(-30, 0, 30, 0);
                flightGrad.addColorStop(0, flightPrimary);
                flightGrad.addColorStop(0.5, '#1e293b');
                flightGrad.addColorStop(1, flightPrimary);
                ctx.fillStyle = flightGrad;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Flight Wing Graphic Chevron
                ctx.beginPath();
                ctx.moveTo(-18, 6);
                ctx.lineTo(-24, 22);
                ctx.lineTo(-6, 12);
                ctx.moveTo(18, 6);
                ctx.lineTo(24, 22);
                ctx.lineTo(6, 12);
                ctx.fillStyle = flightAccent;
                ctx.fill();

                // Center Vertical Fin Shading
                ctx.beginPath();
                ctx.moveTo(-4, -10);
                ctx.lineTo(4, -10);
                ctx.lineTo(3, 26);
                ctx.lineTo(-3, 26);
                ctx.closePath();
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.restore();

                // 3. Aluminum Stem / Shaft
                ctx.save();
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(-3.5, -20, 7, 22);
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-3.5, -20, 7, 22);

                // Stem Accent Rings
                ctx.fillStyle = '#64748b';
                ctx.fillRect(-3.5, -12, 7, 2.5);
                ctx.restore();

                // 4. Knurled Tungsten / Brass Grip Barrel
                ctx.save();
                const barrelGrad = ctx.createLinearGradient(-7, 0, 7, 0);
                barrelGrad.addColorStop(0, '#64748b');
                barrelGrad.addColorStop(0.3, '#f8fafc');
                barrelGrad.addColorStop(0.7, '#94a3b8');
                barrelGrad.addColorStop(1, '#334155');

                ctx.beginPath();
                ctx.moveTo(-6, -20);
                ctx.lineTo(6, -20);
                ctx.lineTo(7, -42);
                ctx.lineTo(4, -48);
                ctx.lineTo(-4, -48);
                ctx.lineTo(-7, -42);
                ctx.closePath();
                ctx.fillStyle = barrelGrad;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Knurling Grip Rings
                ctx.fillStyle = barrelMetal;
                ctx.fillRect(-6.5, -40, 13, 3);
                ctx.fillRect(-6.5, -34, 13, 3);
                ctx.fillRect(-6.5, -28, 13, 3);
                ctx.restore();

                // 5. Stainless Steel Needle Tip
                ctx.save();
                const tipGrad = ctx.createLinearGradient(-3, 0, 3, 0);
                tipGrad.addColorStop(0, '#94a3b8');
                tipGrad.addColorStop(0.5, '#ffffff');
                tipGrad.addColorStop(1, '#475569');

                ctx.beginPath();
                ctx.moveTo(-3, -48);
                ctx.lineTo(0, -66);
                ctx.lineTo(3, -48);
                ctx.closePath();
                ctx.fillStyle = tipGrad;
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();
                ctx.restore();

                ctx.restore();
            }

            drawLandedDarts() {
                this.landedDarts.forEach(d => {
                    this.drawStylizedDart(d.x, d.y, 0.52, d.isBot, true);
                });
            }

            drawFlyingDart() {
                if (!this.flyingDart) return;
                const fd = this.flyingDart;
                fd.t += fd.speed;

                if (fd.t >= 1) {
                    const hit = this.scoreHit(fd.targetX, fd.targetY);
                    this.flyingDart = null;
                    this.onDartLanded(hit);
                    return;
                }

                const t = fd.t;
                fd.x = fd.startX + (fd.targetX - fd.startX) * t;
                const linearY = fd.startY + (fd.targetY - fd.startY) * t;
                const arc = -Math.sin(t * Math.PI) * 70;
                fd.y = linearY + arc;
                const scale = 1.1 - t * 0.58;

                this.drawStylizedDart(fd.x, fd.y, scale, fd.isBot, true);
            }

            drawDartInHand() {
                if (this.flyingDart || this.gameOver) return;
                const isBot = this.turn === 1 && this.gameMode === 'bot';
                const handX = this.width / 2;
                const handY = this.height * 0.82;

                this.drawStylizedDart(handX, handY, 1.25, isBot, true);
            }

            drawFloatingPopups() {
                const ctx = this.ctx;
                for (let i = this.floatingPopups.length - 1; i >= 0; i--) {
                    const p = this.floatingPopups[i];
                    p.life--;
                    p.y += p.vy;
                    if (p.scale < 1.0) p.scale += 0.12;
                    const progress = p.life / p.maxLife;
                    const alpha = Math.min(1, progress * 1.6);

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.scale(p.scale, p.scale);
                    ctx.globalAlpha = alpha;

                    // Glowing pill background
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 16;
                    ctx.fillStyle = '#0f172a';
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3;

                    ctx.font = '900 15px Outfit, sans-serif';
                    const textWidth = ctx.measureText(p.text).width;
                    const boxW = textWidth + 24;
                    const boxH = 30;

                    ctx.beginPath();
                    ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 15);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = p.color;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 6;
                    ctx.fillText(p.text, 0, 1);

                    ctx.restore();

                    if (p.life <= 0) {
                        this.floatingPopups.splice(i, 1);
                    }
                }
            }

            render() {
                const dpr = window.devicePixelRatio || 1;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                this.ctx.clearRect(0, 0, this.width, this.height);

                // Camera Zoom Interpolation
                this.camera.zoom += (this.camera.targetZoom - this.camera.zoom) * 0.12;
                this.camera.focusX += (this.camera.targetFocusX - this.camera.focusX) * 0.12;
                this.camera.focusY += (this.camera.targetFocusY - this.camera.focusY) * 0.12;

                this.ctx.save();
                if (this.camera.zoom !== 1) {
                    this.ctx.translate(this.board.x, this.board.y);
                    this.ctx.scale(this.camera.zoom, this.camera.zoom);
                    this.ctx.translate(-this.camera.focusX, -this.camera.focusY);
                }

                this.drawDartboard();
                this.drawSliders();
                this.drawLandedDarts();
                this.drawFlyingDart();
                this.drawFloatingPopups();

                this.ctx.restore();

                if (this.camera.zoom < 1.15) {
                    this.drawDartInHand();
                }
            }

            loop() {
                this.updateMeters();
                this.render();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.offlineDarts = new OfflineDartsGame();
        });
    })();
    </script>
</body>
</html>
