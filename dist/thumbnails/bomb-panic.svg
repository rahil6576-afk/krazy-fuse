<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bp-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Explosion Burst Gradient -->
    <radialGradient id="burst-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>

    <!-- Bomb Body Spherical Gradient -->
    <radialGradient id="bomb-body" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Spark Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#bp-bg)"/>

  <!-- Dynamic Comic Speed Lines -->
  <g stroke="#6366f1" stroke-width="2" opacity="0.25" stroke-dasharray="8 12">
    <line x1="640" y1="360" x2="0" y2="40"/>
    <line x1="640" y1="360" x2="0" y2="200"/>
    <line x1="640" y1="360" x2="0" y2="520"/>
    <line x1="640" y1="360" x2="0" y2="680"/>
    <line x1="640" y1="360" x2="1280" y2="40"/>
    <line x1="640" y1="360" x2="1280" y2="220"/>
    <line x1="640" y1="360" x2="1280" y2="500"/>
    <line x1="640" y1="360" x2="1280" y2="680"/>
    <line x1="640" y1="360" x2="300" y2="0"/>
    <line x1="640" y1="360" x2="980" y2="0"/>
    <line x1="640" y1="360" x2="300" y2="720"/>
    <line x1="640" y1="360" x2="980" y2="720"/>
  </g>

  <!-- Comic Action Starburst Layer -->
  <g transform="translate(640, 360)" filter="url(#glow)">
    <path d="M 0,-260 L 48,-110 L 190,-210 L 120,-60 L 260,-90 L 145,35 L 260,110 L 125,120 L 180,245 L 45,150 L 0,260 L -45,150 L -180,245 L -125,120 L -260,110 L -145,35 L -260,-90 L -120,-60 L -190,-210 L -48,-110 Z"
          fill="url(#burst-grad)" opacity="0.92"/>
    <path d="M 0,-190 L 35,-80 L 140,-150 L 90,-45 L 190,-65 L 105,25 L 190,80 L 90,90 L 130,180 L 35,110 L 0,190 L -35,110 L -130,180 L -90,90 L -190,80 L -105,25 L -190,-65 L -90,-45 L -140,-150 L -35,-80 Z"
          fill="#fef08a" opacity="0.85"/>
  </g>

  <!-- Ground Shadow for Bomb -->
  <ellipse cx="640" cy="540" rx="190" ry="40" fill="#020617" opacity="0.6" filter="url(#glow)"/>

  <!-- Left Running Cartoon Character (Fleeing) -->
  <g transform="translate(260, 400)" filter="url(#shadow)">
    <!-- Motion lines -->
    <path d="M -80,-30 L -130,-30 M -90,-10 L -150,-10 M -80,10 L -130,10" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <!-- Body (Teal Bean) -->
    <rect x="-45" y="-70" width="90" height="110" rx="45" fill="#06b6d4" stroke="#083344" stroke-width="6"/>
    <!-- Panic Eyes -->
    <ellipse cx="-15" cy="-35" rx="14" ry="18" fill="#ffffff" stroke="#083344" stroke-width="4"/>
    <circle cx="-18" cy="-35" r="7" fill="#0f172a"/>
    <ellipse cx="18" cy="-35" rx="14" ry="18" fill="#ffffff" stroke="#083344" stroke-width="4"/>
    <circle cx="15" cy="-35" r="7" fill="#0f172a"/>
    <!-- Mouth Screaming -->
    <ellipse cx="0" cy="5" rx="14" ry="18" fill="#e11d48" stroke="#083344" stroke-width="4"/>
    <!-- Sweat drop -->
    <path d="M 35,-65 C 45,-60 50,-50 40,-40 C 30,-30 20,-45 35,-65 Z" fill="#38bdf8"/>
    <!-- Running Arms -->
    <path d="M -40,-20 Q -80,-50 -60,-80" fill="none" stroke="#083344" stroke-width="12" stroke-linecap="round"/>
    <path d="M -40,-20 Q -80,-50 -60,-80" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
    <path d="M 40,-20 Q 80,-40 90,-10" fill="none" stroke="#083344" stroke-width="12" stroke-linecap="round"/>
    <path d="M 40,-20 Q 80,-40 90,-10" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
    <!-- Running Feet -->
    <ellipse cx="-30" cy="55" rx="20" ry="12" fill="#0e7490" stroke="#083344" stroke-width="5"/>
    <ellipse cx="40" cy="40" rx="20" ry="12" fill="#0e7490" stroke="#083344" stroke-width="5"/>
  </g>

  <!-- Right Running Cartoon Character (Throwing) -->
  <g transform="translate(1020, 390)" filter="url(#shadow)">
    <!-- Body (Pink Bean) -->
    <rect x="-45" y="-70" width="90" height="110" rx="45" fill="#f43f5e" stroke="#4c0519" stroke-width="6"/>
    <!-- Panic Eyes -->
    <ellipse cx="-18" cy="-35" rx="14" ry="18" fill="#ffffff" stroke="#4c0519" stroke-width="4"/>
    <circle cx="-14" cy="-35" r="7" fill="#0f172a"/>
    <ellipse cx="15" cy="-35" rx="14" ry="18" fill="#ffffff" stroke="#4c0519" stroke-width="4"/>
    <circle cx="19" cy="-35" r="7" fill="#0f172a"/>
    <!-- Screaming Mouth -->
    <ellipse cx="0" cy="5" rx="16" ry="16" fill="#881337" stroke="#4c0519" stroke-width="4"/>
    <!-- Throwing Arm pointing to bomb -->
    <path d="M -40,-20 Q -80,-40 -110,-10" fill="none" stroke="#4c0519" stroke-width="12" stroke-linecap="round"/>
    <path d="M -40,-20 Q -80,-40 -110,-10" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
    <!-- Feet -->
    <ellipse cx="-35" cy="45" rx="20" ry="12" fill="#be123c" stroke="#4c0519" stroke-width="5"/>
    <ellipse cx="30" cy="55" rx="20" ry="12" fill="#be123c" stroke="#4c0519" stroke-width="5"/>
  </g>

  <!-- Center Giant Classic Bomb -->
  <g transform="translate(640, 380)" filter="url(#shadow)">
    <!-- Bomb Fuse (curving out of top) -->
    <path d="M 0,-150 C 40,-220 90,-200 120,-260" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round"/>
    <path d="M 0,-150 C 40,-220 90,-200 120,-260" fill="none" stroke="#fbbf24" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round"/>

    <!-- Fuse Collar (Metal cap on top) -->
    <rect x="-32" y="-160" width="64" height="26" rx="6" fill="#94a3b8" stroke="#334155" stroke-width="5"/>

    <!-- Bomb Body Circle -->
    <circle cx="0" cy="0" r="150" fill="url(#bomb-body)" stroke="#0f172a" stroke-width="8"/>

    <!-- Specular Gloss Highlight -->
    <ellipse cx="-48" cy="-55" rx="42" ry="24" transform="rotate(-35, -48, -55)" fill="#ffffff" opacity="0.32"/>
    <ellipse cx="-58" cy="-62" rx="16" ry="8" transform="rotate(-35, -58, -62)" fill="#ffffff" opacity="0.65"/>

    <!-- Sizzling Fuse Spark (End of Fuse) -->
    <g transform="translate(120, -260)" filter="url(#glow)">
      <!-- Giant Spark Star -->
      <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="#fef08a"/>
      <polygon points="0,-28 7,-7 28,0 7,7 0,28 -7,7 -28,0 -7,-7" fill="#ffffff"/>
      <!-- Tiny Sparks scattering -->
      <circle cx="25" cy="-25" r="5" fill="#f97316"/>
      <circle cx="-30" cy="-20" r="4" fill="#ef4444"/>
      <circle cx="35" cy="15" r="6" fill="#facc15"/>
      <circle cx="-20" cy="30" r="4" fill="#fb923c"/>
      <circle cx="0" cy="-55" r="5" fill="#ffffff"/>
    </g>

    <!-- Bomb Digital Countdown Badge -->
    <rect x="-85" y="-15" width="170" height="50" rx="12" fill="#020617" stroke="#ef4444" stroke-width="4"/>
    <text x="0" y="21" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ef4444" text-anchor="middle" letter-spacing="3" filter="url(#glow)">00:03</text>
  </g>

  <!-- Top Banner Title Badge -->
  <g transform="translate(640, 75)">
    <rect x="-240" y="-35" width="480" height="70" rx="35" fill="#0f172a" stroke="#f97316" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      BOMB PANIC <tspan fill="#f97316">💥 HOT POTATO</tspan>
    </text>
  </g>
</svg>
