<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Cheerful Pop Arcade Background -->
    <radialGradient id="pu-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="85%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glossy Balloon Radial Gradients -->
    <!-- Red Balloon -->
    <radialGradient id="bal-red" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Gold Balloon -->
    <radialGradient id="bal-gold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>

    <!-- Cyan Balloon -->
    <radialGradient id="bal-cyan" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="25%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </radialGradient>

    <!-- Purple Balloon -->
    <radialGradient id="bal-purple" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </radialGradient>

    <!-- Blade Chrome Gradient -->
    <linearGradient id="blade-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="pu-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pu-shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#pu-bg)"/>

  <!-- Celebratory Confetti & Sparkles in Background -->
  <g opacity="0.6">
    <!-- Starbursts -->
    <polygon points="180,120 185,135 200,140 185,145 180,160 175,145 160,140 175,135" fill="#facc15"/>
    <polygon points="1120,180 1125,195 1140,200 1125,205 1120,220 1115,205 1100,200 1115,195" fill="#38bdf8"/>
    <polygon points="340,560 345,570 355,575 345,580 340,590 335,580 325,575 335,570" fill="#ec4899"/>
    <polygon points="980,520 985,530 995,535 985,540 980,550 975,540 965,535 975,530" fill="#4ade80"/>
    <!-- Confetti ribbons & rects -->
    <rect x="220" y="280" width="16" height="8" rx="2" transform="rotate(25, 220, 280)" fill="#f43f5e"/>
    <rect x="880" y="140" width="14" height="6" rx="2" transform="rotate(-35, 880, 140)" fill="#a855f7"/>
    <rect x="1060" y="420" width="18" height="7" rx="2" transform="rotate(45, 1060, 420)" fill="#facc15"/>
    <rect x="420" y="600" width="15" height="6" rx="2" transform="rotate(-15, 420, 600)" fill="#06b6d4"/>
  </g>

  <!-- Left Cyan Balloon -->
  <g transform="translate(320, 360)" filter="url(#pu-shadow)">
    <!-- String -->
    <path d="M 0,110 Q 20,160 -10,210 Q 15,250 0,300" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <!-- Tie Knot -->
    <polygon points="-12,112 12,112 0,100" fill="#0891b2"/>
    <!-- Balloon Body -->
    <ellipse cx="0" cy="0" rx="95" ry="110" fill="url(#bal-cyan)"/>
    <!-- Gloss Highlight -->
    <ellipse cx="-35" cy="-45" rx="30" ry="18" transform="rotate(-25, -35, -45)" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="-42" cy="-52" rx="12" ry="6" transform="rotate(-25, -42, -52)" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Top-Right Gold Balloon -->
  <g transform="translate(940, 260)" filter="url(#pu-shadow)">
    <!-- String -->
    <path d="M 0,105 Q -25,160 10,220" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="-10,107 10,107 0,96" fill="#ca8a04"/>
    <ellipse cx="0" cy="0" rx="90" ry="105" fill="url(#bal-gold)"/>
    <ellipse cx="-32" cy="-42" rx="28" ry="16" transform="rotate(-25, -32, -42)" fill="#ffffff" opacity="0.45"/>
    <ellipse cx="-38" cy="-48" rx="10" ry="5" transform="rotate(-25, -38, -48)" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Bottom-Right Purple Balloon -->
  <g transform="translate(860, 480)" filter="url(#pu-shadow)">
    <path d="M 0,95 Q 15,140 -5,180" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <polygon points="-10,97 10,97 0,86" fill="#9333ea"/>
    <ellipse cx="0" cy="0" rx="80" ry="95" fill="url(#bal-purple)"/>
    <ellipse cx="-28" cy="-38" rx="24" ry="14" transform="rotate(-25, -28, -38)" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Center-Left Popping Red Balloon with Splatter -->
  <g transform="translate(600, 320)">
    <!-- Pop Splash shockwave -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="10 16" opacity="0.6" filter="url(#pu-glow)"/>
    <!-- Shattered Balloon Rubber Fragments -->
    <path d="M -70,-80 Q -110,-40 -120,10 Q -90,-20 -70,-80 Z" fill="#ef4444" filter="url(#pu-shadow)"/>
    <path d="M 40,-110 Q 80,-70 110,-20 Q 70,-40 40,-110 Z" fill="#b91c1c" filter="url(#pu-shadow)"/>
    <path d="M -80,60 Q -50,110 0,120 Q -40,80 -80,60 Z" fill="#ef4444" filter="url(#pu-shadow)"/>
    <path d="M 60,60 Q 110,80 130,40 Q 90,40 60,60 Z" fill="#b91c1c" filter="url(#pu-shadow)"/>
    <!-- Pop Spark Star -->
    <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10" fill="#facc15" filter="url(#pu-glow)"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>

  <!-- Spinning Chrome Blade Disc (Slicing Right Through Center!) -->
  <g transform="translate(600, 320)" filter="url(#pu-glow)">
    <!-- Motion Blur Swoosh Ring -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="60 30" opacity="0.75"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="40 20" opacity="0.9"/>

    <!-- Four Curved Chrome Ninja Blade Shuriken Fins -->
    <path d="M 0,-85 C 35,-85 60,-50 85,0 C 50,0 35,-35 0,-85 Z" fill="url(#blade-chrome)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 85,0 C 85,35 50,60 0,85 C 0,50 35,35 85,0 Z" fill="url(#blade-chrome)" stroke="#0f172a" stroke-width="3"/>
    <path d="M 0,85 C -35,85 -60,50 -85,0 C -50,0 -35,35 0,85 Z" fill="url(#blade-chrome)" stroke="#0f172a" stroke-width="3"/>
    <path d="M -85,0 C -85,-35 -50,-60 0,-85 C 0,-50 -35,-35 -85,0 Z" fill="url(#blade-chrome)" stroke="#0f172a" stroke-width="3"/>

    <!-- Center Brass Pivot Ring -->
    <circle cx="0" cy="0" r="28" fill="#e2e8f0" stroke="#0f172a" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#0284c7"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Title Pill Badge -->
  <g transform="translate(640, 65)">
    <rect x="-240" y="-32" width="480" height="64" rx="32" fill="#09090b" stroke="#f43f5e" stroke-width="4" opacity="0.95"/>
    <text x="0" y="10" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      POP UP <tspan fill="#f43f5e">🎈 BALLOON BLITZ</tspan>
    </text>
  </g>
</svg>
