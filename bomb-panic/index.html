<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bomb Panic: Hot Potato Arena 💣💥 — Krazio Games</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --arena-border: #ef4444;
            --accent-cyan: #00d2d3;
            --accent-gold: #fbc531;
            --accent-pink: #ff4757;
            --font-main: 'Fredoka', 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            font-family: var(--font-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #gameWrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #0d1322;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top HUD Bar */
        .top-hud {
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 30;
            pointer-events: none;
        }

        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .btn-hud {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            font-size: 1.4rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, background 0.2s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        .btn-hud:hover {
            transform: scale(1.08);
            background: rgba(30, 41, 59, 0.95);
        }

        .btn-hud:active {
            transform: scale(0.94);
        }

        /* Center Panic Bomb Fuse HUD */
        .fuse-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(239, 68, 68, 0.5);
            border-radius: 9999px;
            padding: 8px 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
            pointer-events: auto;
            animation: pulsePill 1.2s infinite ease-in-out;
        }

        @keyframes pulsePill {
            0%, 100% { border-color: rgba(239, 68, 68, 0.5); transform: scale(1); }
            50% { border-color: rgba(255, 71, 87, 1); transform: scale(1.03); }
        }

        .fuse-icon {
            font-size: 1.8rem;
            animation: spinFuse 0.8s infinite linear;
        }

        @keyframes spinFuse {
            0% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
            100% { transform: rotate(-8deg); }
        }

        .fuse-timer-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff4757;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: center;
        }

        .alive-pill {
            background: rgba(30, 41, 59, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            padding: 6px 18px;
            color: #00d2d3;
            font-size: 1.05rem;
            font-weight: 900;
            backdrop-filter: blur(8px);
        }

        /* Interactive Canvas */
        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        /* Action Hint Banner */
        .action-banner {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 24px;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 800;
            z-index: 25;
            pointer-events: none;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-banner span {
            color: #fbc531;
        }

        /* Mobile Touch Controls */
        .mobile-controls {
            position: absolute;
            inset: 0;
            z-index: 25;
            pointer-events: none;
            display: none;
        }

        @media (max-width: 900px), (pointer: coarse) {
            .mobile-controls {
                display: block;
            }
        }

        .joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.25);
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joystick-knob {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8, #0284c7);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            pointer-events: none;
            transform: translate(0, 0);
            transition: transform 0.05s ease-out;
        }

        .btn-throw-mobile {
            position: absolute;
            bottom: 35px;
            right: 35px;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #e84118);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.5);
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-throw-mobile:active {
            transform: scale(0.9);
        }

        /* Modal Overlay (Menu / Game Over / Lobby) */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 12, 22, 0.85);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #1e293b;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            color: #fff;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .modal-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ff4757;
            margin-bottom: 6px;
            text-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .modal-sub {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 14px 18px;
            color: #fff;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .btn-mode.active {
            background: #ff4757;
            border-color: #ff6b81;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4);
        }

        .btn-start {
            width: 100%;
            background: linear-gradient(135deg, #fbc531, #e1b12c);
            color: #2f3640;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(251, 197, 49, 0.4);
            transition: transform 0.15s ease;
        }

        .btn-start:hover {
            transform: scale(1.03);
        }

        /* Screen Flash on Explosion */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: #ff4757;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.15s ease-out;
        }

        .flash-overlay.boom {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="gameWrapper">
        <!-- Top HUD -->
        <header class="top-hud">
            <div class="hud-left">
                <a href="../index.html" class="btn-hud" title="Back to Games">‹</a>
                <button class="btn-hud" id="btnSettings" title="Lobby / Modes">⚙️</button>
            </div>

            <!-- Fuse Pill Indicator -->
            <div class="fuse-pill" id="fusePill">
                <span class="fuse-icon">💣</span>
                <span class="fuse-timer-text" id="fuseTimer">10.0s</span>
            </div>

            <div class="hud-right">
                <div class="alive-pill" id="alivePill">5 ALIVE</div>
                <button class="btn-hud" id="btnMute" title="Toggle Sound">🔊</button>
            </div>
        </header>

        <!-- Canvas Arena Stage -->
        <canvas id="gameCanvas"></canvas>

        <!-- Touch Controls for Mobile / Tablets -->
        <div class="mobile-controls">
            <div class="joystick-zone" id="joystickZone">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <button class="btn-throw-mobile" id="btnThrowMobile">
                <span>💣</span>
                <span>THROW</span>
            </button>
        </div>

        <!-- Action Hint -->
        <div class="action-banner">
            🎯 <span>WASD / ARROWS:</span> Move &nbsp;|&nbsp; <span>SPACE / CLICK:</span> Throw Bomb!
        </div>

        <!-- Flash Effect -->
        <div class="flash-overlay" id="flashOverlay"></div>

        <!-- Game Lobby / Game Over Modal -->
        <div class="modal-overlay active" id="modalOverlay">
            <div class="modal-box">
                <h2 class="modal-title" id="modalTitle">💣 BOMB PANIC</h2>
                <p class="modal-sub" id="modalSub">PASS → RUN → THROW → SURVIVE</p>

                <div class="mode-list">
                    <button class="btn-mode active" data-mode="solo">
                        <span>🤖 Solo vs 4 Smart Bots</span>
                        <span>›</span>
                    </button>
                    <button class="btn-mode" data-mode="chaos">
                        <span>🔥 8-Player Mega Chaos</span>
                        <span>›</span>
                    </button>
                    <button class="btn-mode" data-mode="local">
                        <span>👥 Local 2-Player Split</span>
                        <span>›</span>
                    </button>
                </div>

                <button class="btn-start" id="btnStartGame">ENTER ARENA</button>
            </div>
        </div>
    </div>

    <!-- Complete Bomb Panic Physics, AI & Web Audio Synthesizer -->
    <script>
    (function() {
        'use strict';

        // 1. Web Audio Synthesizer
        class BombAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
            playTick(pitch = 600) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.06);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            }
            playPass() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(540, now + 0.12);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            playThrow() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playBoom() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
                gain.gain.setValueAtTime(0.9, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.6);
            }
            playPowerup() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const audio = new BombAudio();

        // 2. Character Roster Definitions
        const ROSTER = [
            { id: 'p1', name: 'YOU', emoji: '😎', color: '#38bdf8', isPlayer: true },
            { id: 'bot1', name: 'Blaze', emoji: '😈', color: '#ff4757', isPlayer: false },
            { id: 'bot2', name: 'Spike', emoji: '🤖', color: '#2ed573', isPlayer: false },
            { id: 'bot3', name: 'Luna', emoji: '🐱', color: '#a55eea', isPlayer: false },
            { id: 'bot4', name: 'Dash', emoji: '🦊', color: '#ffa502', isPlayer: false },
            { id: 'bot5', name: 'Vortex', emoji: '👽', color: '#00d2d3', isPlayer: false },
            { id: 'bot6', name: 'Rex', emoji: '🦖', color: '#eb4d4b', isPlayer: false },
            { id: 'bot7', name: 'Ghost', emoji: '👻', color: '#dfe4ea', isPlayer: false }
        ];

        // 3. Player Character Entity
        class Player {
            constructor(info, x, y) {
                this.id = info.id;
                this.name = info.name;
                this.emoji = info.emoji;
                this.color = info.color;
                this.isPlayer = info.isPlayer;

                this.x = x;
                this.y = y;
                this.radius = 22;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.6;
                this.facingAngle = 0;
                this.alive = true;
                this.hasBomb = false;
                this.speedBuffTimer = 0;
                this.frozenTimer = 0;
                this.immunityTimer = 0; // Brief pass immunity
                this.animCycle = 0;
                this.bark = '';
                this.barkTimer = 0;
            }

            say(text) {
                this.bark = text;
                this.barkTimer = 90;
            }

            update(arena, players, airborneBomb) {
                if (!this.alive) return;

                if (this.barkTimer > 0) this.barkTimer--;
                if (this.immunityTimer > 0) this.immunityTimer--;
                if (this.speedBuffTimer > 0) this.speedBuffTimer--;

                if (this.frozenTimer > 0) {
                    this.frozenTimer--;
                    return;
                }

                const currentSpeed = this.speed * (this.speedBuffTimer > 0 ? 1.45 : 1.0) * (this.hasBomb ? 1.08 : 1.0);

                // Movement execution
                this.x += this.vx * currentSpeed;
                this.y += this.vy * currentSpeed;

                if (Math.hypot(this.vx, this.vy) > 0.1) {
                    this.facingAngle = Math.atan2(this.vy, this.vx);
                    this.animCycle += 0.25;
                }

                // Arena Boundary Enclosure
                const minX = arena.x + this.radius;
                const maxX = arena.x + arena.w - this.radius;
                const minY = arena.y + this.radius;
                const maxY = arena.y + arena.h - this.radius;

                if (this.x < minX) { this.x = minX; this.vx = 0; }
                if (this.x > maxX) { this.x = maxX; this.vx = 0; }
                if (this.y < minY) { this.y = minY; this.vy = 0; }
                if (this.y > maxY) { this.y = maxY; this.vy = 0; }
            }

            aiBehavior(arena, players, airborneBomb) {
                if (!this.alive || this.isPlayer || this.frozenTimer > 0) return;

                const bombHolder = players.find(p => p.hasBomb && p.alive);

                if (this.hasBomb) {
                    // HAS BOMB: Chase nearest living victim to pass it!
                    let nearest = null;
                    let minDist = Infinity;

                    players.forEach(p => {
                        if (p !== this && p.alive && p.immunityTimer <= 0) {
                            const d = Math.hypot(p.x - this.x, p.y - this.y);
                            if (d < minDist) {
                                minDist = d;
                                nearest = p;
                            }
                        }
                    });

                    if (nearest) {
                        const angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                        this.vx = Math.cos(angle);
                        this.vy = Math.sin(angle);

                        // Randomly throw if in range and line of sight
                        if (minDist < 260 && Math.random() < 0.04) {
                            return { action: 'throw', targetX: nearest.x, targetY: nearest.y };
                        }
                    }
                } else {
                    // FLEE: Run away from the bomb holder or airborne bomb!
                    let dangerX = bombHolder ? bombHolder.x : arena.x + arena.w / 2;
                    let dangerY = bombHolder ? bombHolder.y : arena.y + arena.h / 2;

                    if (airborneBomb) {
                        dangerX = airborneBomb.targetX;
                        dangerY = airborneBomb.targetY;
                    }

                    // Vector away from danger
                    let fleeAngle = Math.atan2(this.y - dangerY, this.x - dangerX);

                    // Corner avoidance: Steer towards arena center if near walls
                    const distToEdgeX = Math.min(this.x - arena.x, (arena.x + arena.w) - this.x);
                    const distToEdgeY = Math.min(this.y - arena.y, (arena.y + arena.h) - this.y);

                    if (distToEdgeX < 60 || distToEdgeY < 60) {
                        const centerX = arena.x + arena.w / 2;
                        const centerY = arena.y + arena.h / 2;
                        const centerAngle = Math.atan2(centerY - this.y, centerX - this.x);
                        fleeAngle = fleeAngle * 0.6 + centerAngle * 0.4;
                    }

                    this.vx = Math.cos(fleeAngle);
                    this.vy = Math.sin(fleeAngle);
                }

                return null;
            }
        }

        // 4. Main Game Engine
        class BombPanicGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.width = window.innerWidth;
                this.height = window.innerHeight;

                // Arena Shrinking State
                this.arena = {
                    x: 100,
                    y: 80,
                    w: 800,
                    h: 600,
                    targetW: 800,
                    targetH: 600
                };

                this.players = [];
                this.airborneBomb = null;
                this.powerups = [];
                this.particles = [];

                // Fuse Timer (Random 8 - 14s)
                this.fuseTime = 10.0;
                this.maxFuse = 10.0;
                this.lastTickTime = 0;
                this.state = 'LOBBY'; // 'LOBBY' | 'PLAYING' | 'GAMEOVER'
                this.mode = 'solo'; // 'solo' | 'chaos' | 'local'

                this.keys = {};
                this.mouse = { x: 0, y: 0 };
                this.joystick = { active: false, vx: 0, vy: 0 };

                this.resize();
                this.setupInputs();
                this.setupUI();
                this.loop();
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.canvas.style.width = `${this.width}px`;
                this.canvas.style.height = `${this.height}px`;

                const marginX = Math.max(40, this.width * 0.12);
                const marginY = Math.max(70, this.height * 0.12);

                this.arena.w = this.width - marginX * 2;
                this.arena.h = this.height - marginY * 2;
                this.arena.x = marginX;
                this.arena.y = marginY;
                this.arena.targetW = this.arena.w;
                this.arena.targetH = this.arena.h;
            }

            setupInputs() {
                window.addEventListener('resize', () => this.resize());

                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space' || e.code === 'KeyE') {
                        e.preventDefault();
                        this.tryPlayerThrow();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                this.canvas.addEventListener('pointerdown', (e) => {
                    audio.init();
                    if (this.state === 'PLAYING') {
                        this.tryPlayerThrow(e.clientX, e.clientY);
                    }
                });

                // Mobile Virtual Joystick
                const zone = document.getElementById('joystickZone');
                const knob = document.getElementById('joystickKnob');
                const btnThrowMobile = document.getElementById('btnThrowMobile');

                if (zone && knob) {
                    let startX = 0, startY = 0;
                    zone.addEventListener('touchstart', (e) => {
                        const touch = e.touches[0];
                        const rect = zone.getBoundingClientRect();
                        startX = rect.left + rect.width / 2;
                        startY = rect.top + rect.height / 2;
                        this.joystick.active = true;
                    });

                    zone.addEventListener('touchmove', (e) => {
                        if (!this.joystick.active) return;
                        const touch = e.touches[0];
                        const dx = touch.clientX - startX;
                        const dy = touch.clientY - startY;
                        const dist = Math.min(45, Math.hypot(dx, dy));
                        const angle = Math.atan2(dy, dx);

                        this.joystick.vx = Math.cos(angle) * (dist / 45);
                        this.joystick.vy = Math.sin(angle) * (dist / 45);

                        knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                    });

                    const resetJoystick = () => {
                        this.joystick.active = false;
                        this.joystick.vx = 0;
                        this.joystick.vy = 0;
                        knob.style.transform = `translate(0, 0)`;
                    };

                    zone.addEventListener('touchend', resetJoystick);
                    zone.addEventListener('touchcancel', resetJoystick);
                }

                if (btnThrowMobile) {
                    btnThrowMobile.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        audio.init();
                        this.tryPlayerThrow();
                    });
                }
            }

            setupUI() {
                const modal = document.getElementById('modalOverlay');
                const btnStart = document.getElementById('btnStartGame');
                const btnSettings = document.getElementById('btnSettings');
                const btnMute = document.getElementById('btnMute');
                const modeBtns = document.querySelectorAll('.btn-mode');

                modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        modeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.mode = btn.getAttribute('data-mode');
                    });
                });

                if (btnStart) {
                    btnStart.addEventListener('click', () => {
                        audio.init();
                        modal.classList.remove('active');
                        this.startMatch();
                    });
                }

                if (btnSettings) {
                    btnSettings.addEventListener('click', () => {
                        modal.classList.add('active');
                    });
                }

                if (btnMute) {
                    btnMute.addEventListener('click', () => {
                        const muted = audio.toggleMute();
                        btnMute.textContent = muted ? '🔇' : '🔊';
                    });
                }
            }

            startMatch() {
                this.state = 'PLAYING';
                this.resize();
                this.particles = [];
                this.powerups = [];
                this.airborneBomb = null;

                const playerCount = this.mode === 'chaos' ? 8 : (this.mode === 'local' ? 4 : 5);
                const activeRoster = ROSTER.slice(0, playerCount);

                if (this.mode === 'local') {
                    activeRoster[1].name = 'P2 (Arrows)';
                    activeRoster[1].isPlayer = true;
                }

                // Spawn players along circle
                const centerX = this.arena.x + this.arena.w / 2;
                const centerY = this.arena.y + this.arena.h / 2;
                const spawnRadius = Math.min(this.arena.w, this.arena.h) * 0.35;

                this.players = activeRoster.map((info, idx) => {
                    const angle = (idx / playerCount) * Math.PI * 2;
                    const x = centerX + Math.cos(angle) * spawnRadius;
                    const y = centerY + Math.sin(angle) * spawnRadius;
                    return new Player(info, x, y);
                });

                // Pick random starting bomb holder (Give to bot on start)
                const startHolderIdx = Math.floor(Math.random() * (this.players.length - 1)) + 1;
                this.players[startHolderIdx].hasBomb = true;
                this.players[startHolderIdx].say('I GOT THE BOMB!');

                this.resetFuseTimer();
                this.updateHUD();
            }

            resetFuseTimer() {
                // Random 7.5 to 13.0s fuse
                this.maxFuse = 7.5 + Math.random() * 5.5;
                this.fuseTime = this.maxFuse;
                this.lastTickTime = performance.now();
            }

            tryPlayerThrow(targetX, targetY) {
                const player = this.players.find(p => p.isPlayer && p.hasBomb && p.alive);
                if (!player) return;

                let tx = targetX || (player.x + Math.cos(player.facingAngle) * 220);
                let ty = targetY || (player.y + Math.sin(player.facingAngle) * 220);

                this.launchBomb(player, tx, ty);
            }

            launchBomb(thrower, targetX, targetY) {
                audio.playThrow();
                thrower.hasBomb = false;
                thrower.immunityTimer = 45; // Brief immunity after throw

                this.airborneBomb = {
                    startX: thrower.x,
                    startY: thrower.y,
                    targetX: Math.max(this.arena.x + 20, Math.min(this.arena.x + this.arena.w - 20, targetX)),
                    targetY: Math.max(this.arena.y + 20, Math.min(this.arena.y + this.arena.h - 20, targetY)),
                    t: 0,
                    speed: 0.055,
                    throwerId: thrower.id
                };
            }

            triggerExplosion(victim) {
                audio.playBoom();

                // Screen Flash
                const flash = document.getElementById('flashOverlay');
                if (flash) {
                    flash.classList.add('boom');
                    setTimeout(() => flash.classList.remove('boom'), 180);
                }

                // Blast Particles
                for (let i = 0; i < 40; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 8;
                    this.particles.push({
                        x: victim.x,
                        y: victim.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 4 + Math.random() * 6,
                        color: Math.random() > 0.4 ? '#ff4757' : (Math.random() > 0.5 ? '#ffa502' : '#2f3542'),
                        life: 35
                    });
                }

                victim.alive = false;
                victim.hasBomb = false;

                const aliveSurvivors = this.players.filter(p => p.alive);
                this.updateHUD();

                // Check Victory
                if (aliveSurvivors.length <= 1) {
                    this.state = 'GAMEOVER';
                    const winner = aliveSurvivors[0] || victim;
                    setTimeout(() => {
                        const modal = document.getElementById('modalOverlay');
                        document.getElementById('modalTitle').textContent = `🏆 ${winner.name} WINS!`;
                        document.getElementById('modalSub').textContent = `${winner.name} survived the Bomb Panic!`;
                        document.getElementById('btnStartGame').textContent = 'PLAY AGAIN';
                        modal.classList.add('active');
                    }, 800);
                    return;
                }

                // SHRINK ARENA BY 15% AFTER EACH ELIMINATION
                this.arena.targetW = Math.max(340, this.arena.targetW * 0.85);
                this.arena.targetH = Math.max(260, this.arena.targetH * 0.85);

                // Pass bomb to random survivor
                const nextLucky = aliveSurvivors[Math.floor(Math.random() * aliveSurvivors.length)];
                nextLucky.hasBomb = true;
                nextLucky.say('NEW BOMB SPAWNED!');
                this.resetFuseTimer();

                // Spawn power-up in arena
                if (Math.random() < 0.8) {
                    this.spawnPowerup();
                }
            }

            spawnPowerup() {
                const types = ['SPEED', 'FREEZE'];
                const type = types[Math.floor(Math.random() * types.length)];
                const x = this.arena.x + 40 + Math.random() * (this.arena.w - 80);
                const y = this.arena.y + 40 + Math.random() * (this.arena.h - 80);
                this.powerups.push({ x, y, type, radius: 18, life: 600 });
            }

            update() {
                if (this.state !== 'PLAYING') return;

                // Smooth Arena Shrink Interpolation
                this.arena.w += (this.arena.targetW - this.arena.w) * 0.05;
                this.arena.h += (this.arena.targetH - this.arena.h) * 0.05;
                this.arena.x = (this.width - this.arena.w) / 2;
                this.arena.y = (this.height - this.arena.h) / 2;

                // Update Fuse Timer
                this.fuseTime = Math.max(0, this.fuseTime - 0.016);
                document.getElementById('fuseTimer').textContent = `${this.fuseTime.toFixed(1)}s`;

                // Ticking Audio rate increases as timer drops
                const now = performance.now();
                const tickInterval = Math.max(120, (this.fuseTime / this.maxFuse) * 800);
                if (now - this.lastTickTime > tickInterval) {
                    this.lastTickTime = now;
                    const pitch = 500 + (1 - this.fuseTime / this.maxFuse) * 500;
                    audio.playTick(pitch);
                }

                // Bomb Detonation at 0.0s!
                if (this.fuseTime <= 0) {
                    const bombHolder = this.players.find(p => p.hasBomb && p.alive);
                    if (bombHolder) {
                        this.triggerExplosion(bombHolder);
                        return;
                    }
                }

                // Player 1 Input
                const p1 = this.players[0];
                if (p1 && p1.alive && p1.isPlayer) {
                    let moveX = 0, moveY = 0;
                    if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveX -= 1;
                    if (this.keys['KeyD'] || this.keys['ArrowRight']) moveX += 1;
                    if (this.keys['KeyW'] || this.keys['ArrowUp']) moveY -= 1;
                    if (this.keys['KeyS'] || this.keys['ArrowDown']) moveY += 1;

                    if (this.joystick.active) {
                        moveX = this.joystick.vx;
                        moveY = this.joystick.vy;
                    }

                    const len = Math.hypot(moveX, moveY);
                    if (len > 0.05) {
                        p1.vx = moveX / Math.max(1, len);
                        p1.vy = moveY / Math.max(1, len);
                    } else {
                        p1.vx = 0;
                        p1.vy = 0;
                    }
                }

                // Update all players & run AI
                this.players.forEach(p => {
                    const aiAction = p.aiBehavior(this.arena, this.players, this.airborneBomb);
                    if (aiAction && aiAction.action === 'throw') {
                        this.launchBomb(p, aiAction.targetX, aiAction.targetY);
                    }
                    p.update(this.arena, this.players, this.airborneBomb);
                });

                // Airborne Bomb Flight & Catching
                if (this.airborneBomb) {
                    const ab = this.airborneBomb;
                    ab.t += ab.speed;

                    const curX = ab.startX + (ab.targetX - ab.startX) * ab.t;
                    const linearY = ab.startY + (ab.targetY - ab.startY) * ab.t;
                    const arc = -Math.sin(ab.t * Math.PI) * 55;
                    const curY = linearY + arc;

                    // Check mid-air interception by any other player
                    if (ab.t > 0.3) {
                        for (const p of this.players) {
                            if (p.alive && p.immunityTimer <= 0) {
                                if (Math.hypot(p.x - curX, p.y - curY) < p.radius + 15) {
                                    audio.playPass();
                                    p.hasBomb = true;
                                    p.say('INTERCEPTED!');
                                    this.airborneBomb = null;
                                    break;
                                }
                            }
                        }
                    }

                    // Landed on ground
                    if (this.airborneBomb && ab.t >= 1) {
                        // Nearest player picks it up
                        let nearest = null;
                        let minDist = Infinity;
                        this.players.forEach(p => {
                            if (p.alive) {
                                const d = Math.hypot(p.x - ab.targetX, p.y - ab.targetY);
                                if (d < minDist) { minDist = d; nearest = p; }
                            }
                        });

                        if (nearest) {
                            audio.playPass();
                            nearest.hasBomb = true;
                            nearest.say('CAUGHT IT!');
                        }
                        this.airborneBomb = null;
                    }
                }

                // Physical Tag Collisions (Player-to-Player Bomb Transfer)
                const bombGuy = this.players.find(p => p.hasBomb && p.alive);
                if (bombGuy) {
                    for (const victim of this.players) {
                        if (victim !== bombGuy && victim.alive && victim.immunityTimer <= 0) {
                            const dist = Math.hypot(bombGuy.x - victim.x, bombGuy.y - victim.y);
                            if (dist < bombGuy.radius + victim.radius) {
                                // PASS THE BOMB!
                                audio.playPass();
                                bombGuy.hasBomb = false;
                                bombGuy.immunityTimer = 40;
                                victim.hasBomb = true;
                                victim.say('TAGGED! RUN!');

                                // Knockback impulse
                                const angle = Math.atan2(victim.y - bombGuy.y, victim.x - bombGuy.x);
                                victim.x += Math.cos(angle) * 15;
                                victim.y += Math.sin(angle) * 15;
                                break;
                            }
                        }
                    }
                }

                // Power-up Pickups
                for (let i = this.powerups.length - 1; i >= 0; i--) {
                    const pw = this.powerups[i];
                    pw.life--;

                    for (const p of this.players) {
                        if (p.alive && Math.hypot(p.x - pw.x, p.y - pw.y) < p.radius + pw.radius) {
                            audio.playPowerup();
                            if (pw.type === 'SPEED') {
                                p.speedBuffTimer = 240;
                                p.say('SPEED BOOST!');
                            } else if (pw.type === 'FREEZE') {
                                this.players.forEach(other => {
                                    if (other !== p && other.alive) {
                                        other.frozenTimer = 90;
                                        other.say('FROZEN!');
                                    }
                                });
                            }
                            this.powerups.splice(i, 1);
                            break;
                        }
                    }

                    if (pw.life <= 0) this.powerups.splice(i, 1);
                }

                // Update Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const pt = this.particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life--;
                    if (pt.life <= 0) this.particles.splice(i, 1);
                }
            }

            updateHUD() {
                const aliveCount = this.players.filter(p => p.alive).length;
                document.getElementById('alivePill').textContent = `${aliveCount} ALIVE`;
            }

            draw() {
                const dpr = window.devicePixelRatio || 1;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                this.ctx.clearRect(0, 0, this.width, this.height);

                const ctx = this.ctx;
                const a = this.arena;

                // 1. Toxic Danger Storm Border (Outside Arena)
                ctx.fillStyle = 'rgba(239, 68, 68, 0.18)';
                ctx.fillRect(0, 0, this.width, this.height);

                // 2. Arena Safe Floor
                ctx.save();
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.roundRect(a.x, a.y, a.w, a.h, 24);
                ctx.fill();

                // Arena Grid Lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1.5;
                for (let x = a.x; x < a.x + a.w; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(x, a.y);
                    ctx.lineTo(x, a.y + a.h);
                    ctx.stroke();
                }
                for (let y = a.y; y < a.y + a.h; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(a.x, y);
                    ctx.lineTo(a.x + a.w, y);
                    ctx.stroke();
                }

                // Electric Pulsing Arena Wall
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 16;
                ctx.stroke();
                ctx.restore();

                // 3. Power-ups
                this.powerups.forEach(pw => {
                    ctx.save();
                    ctx.translate(pw.x, pw.y);
                    ctx.beginPath();
                    ctx.arc(0, 0, pw.radius, 0, Math.PI * 2);
                    ctx.fillStyle = pw.type === 'SPEED' ? '#fbc531' : '#00d2d3';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 12;
                    ctx.fill();

                    ctx.font = '16px Outfit, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(pw.type === 'SPEED' ? '⚡' : '❄️', 0, 1);
                    ctx.restore();
                });

                // 4. Players
                this.players.forEach(p => {
                    if (!p.alive) return;

                    ctx.save();
                    ctx.translate(p.x, p.y);

                    // Warning Radius if holding bomb
                    if (p.hasBomb) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.radius + 12 + Math.sin(Date.now() * 0.02) * 4, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                        ctx.fill();
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    // Frozen Ice Shell
                    if (p.frozenTimer > 0) {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.radius + 6, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 210, 211, 0.45)';
                        ctx.fill();
                        ctx.strokeStyle = '#38bdf8';
                        ctx.stroke();
                    }

                    // Body Capsule Circle
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = p.isPlayer ? 14 : 4;
                    ctx.fill();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#1e293b';
                    ctx.stroke();

                    // Character Emoji Face
                    ctx.font = '22px Outfit, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.emoji, 0, 1);

                    // Name Tag
                    ctx.font = p.isPlayer ? '900 12px Outfit' : '800 11px Outfit';
                    ctx.fillStyle = p.isPlayer ? '#fbc531' : '#fff';
                    ctx.fillText(p.name, 0, -p.radius - 8);

                    // Held Bomb Animated on Head
                    if (p.hasBomb) {
                        const bombBounce = Math.sin(Date.now() * 0.02) * 5;
                        ctx.font = '26px Outfit';
                        ctx.fillText('💣', 0, -p.radius - 24 + bombBounce);
                    }

                    // Bark Speech Bubble
                    if (p.barkTimer > 0 && p.bark) {
                        ctx.font = 'bold 10px Outfit';
                        const tw = ctx.measureText(p.bark).width + 14;
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                        ctx.beginPath();
                        ctx.roundRect(-tw/2, -p.radius - 48, tw, 18, 6);
                        ctx.fill();
                        ctx.fillStyle = '#ff4757';
                        ctx.fillText(p.bark, 0, -p.radius - 35);
                    }

                    ctx.restore();
                });

                // 5. Airborne Lobbed Bomb
                if (this.airborneBomb) {
                    const ab = this.airborneBomb;
                    const curX = ab.startX + (ab.targetX - ab.startX) * ab.t;
                    const linearY = ab.startY + (ab.targetY - ab.startY) * ab.t;
                    const arc = -Math.sin(ab.t * Math.PI) * 55;
                    const curY = linearY + arc;

                    ctx.save();
                    ctx.translate(curX, curY);
                    ctx.font = '32px Outfit';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', 0, 0);
                    ctx.restore();
                }

                // 6. Blast Particles
                this.particles.forEach(pt => {
                    ctx.save();
                    ctx.globalAlpha = pt.life / 35;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    ctx.fillStyle = pt.color;
                    ctx.fill();
                    ctx.restore();
                });
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.loop());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.bombPanic = new BombPanicGame();
        });
    })();
    </script>
</body>
</html>
