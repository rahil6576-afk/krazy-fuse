<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../../krazio-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixi.js WebGL Arena ⚡ — krazio games</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
      #krazio-floating-back {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 99999;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(99, 102, 241, 0.4);
        color: #f8fafc;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        padding: 8px 16px;
        border-radius: 9999px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.3);
        transition: all 0.2s ease;
      }
      #krazio-floating-back:hover {
        background: rgba(79, 70, 229, 0.95);
        border-color: #6366f1;
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(79, 70, 229, 0.6);
      }
      #pixi-ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
        padding: 10px 24px;
        color: #fff;
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 0.9rem;
        z-index: 100;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        display: flex;
        gap: 16px;
      }
    </style>
</head>

<body>
    <!-- Floating Back to Krazio Hub Button -->
    <a href="../index.html" id="krazio-floating-back" title="Back to krazio games portal">
      <img src="../../krazio-icon.svg" alt="krazio" style="width: 20px; height: 20px; border-radius: 50%;" onerror="this.src='/favicon.png'">
      <span>🏠 KRAZIO GAMES</span>
    </a>

    <div id="pixi-ui-overlay">
      <span>⚡ PixiJS v8 WebGL Accelerated</span>
      <span>👆 Click / Drag to Spawn & Interact</span>
    </div>

    <div id="app">
        <div id="pixi-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
