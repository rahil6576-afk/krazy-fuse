<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <linearGradient id="fuseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="brandGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4353ff" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <g filter="url(#brandGlow)">
    <!-- Circular Emblem Logo Mark Ahead -->
    <circle cx="42" cy="45" r="32" fill="#4353ff" />
    <rect x="27" y="24" width="9.5" height="42" rx="1.5" fill="#ffffff" />
    <rect x="36" y="47" width="20" height="9.5" rx="1.5" transform="rotate(-42 36 47)" fill="#ffffff" />
    <circle cx="45" cy="58" r="5.5" fill="#ffffff" />

    <!-- Main Title: Krazy Fuse -->
    <text x="88" y="48" font-family="'Outfit', -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="url(#fuseGrad)">Krazy <tspan fill="url(#fuseGrad)">Fuse</tspan></text>
    
    <!-- Second Header: live to play starting directly below 'F' of Fuse (x=202) -->
    <text x="202" y="68" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-decoration="underline">LIVE TO PLAY</text>
  </g>
</svg>
