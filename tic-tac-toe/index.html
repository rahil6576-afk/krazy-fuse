<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sumi-e Tac Toe: Zen Brush & AI 墨絵 ❌⭕ — krazio games</title>
    <!-- Favicon -->
    <link rel="icon" href="../krazio-icon.svg" type="image/svg+xml">
    <!-- Google Fonts: Traditional Japanese Calligraphy & Brush Serifs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;900&family=Yuji+Boku&family=Outfit:wght@400;600;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <script>
        (function() {
            if (window.parent !== window || window.location.search.includes('embedded=true')) {
                document.documentElement.classList.add('is-embedded');
                document.addEventListener('DOMContentLoaded', () => document.body && document.body.classList.add('is-embedded'));
            }
            function exitToPortal() {
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'EXIT_TO_PORTAL' }, '*');
                } else {
                    window.location.href = '../index.html';
                }
            }
            window.exitToPortal = exitToPortal;
            document.addEventListener('click', function(e) {
                const a = e.target.closest('a');
                if (a) {
                    const href = a.getAttribute('href');
                    if (href && (href.includes('index.html') || href === '/' || href === '../' || href === '../index.html')) {
                        e.preventDefault();
                        e.stopPropagation();
                        exitToPortal();
                        return false;
                    }
                }
            }, true);
        })();
    </script>
    <style>
        html.is-embedded .portal-topbar,
        html.is-embedded .portal-sidebar,
        html.is-embedded .portal-rec-col,
        html.is-embedded .game-meta-bar,
        html.is-embedded #krazio-floating-back,
        body.is-embedded .portal-topbar,
        body.is-embedded .portal-sidebar,
        body.is-embedded .portal-rec-col,
        body.is-embedded .game-meta-bar,
        body.is-embedded #krazio-floating-back {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        html.is-embedded .portal-center-col,
        body.is-embedded .portal-center-col {
            padding: 0 !important;
            justify-content: center !important;
        }

        :root {
            /* Traditional Sumi-e & Washi Palette */
            --washi-bg: #f4edd9;
            --washi-bg-card: rgba(248, 243, 231, 0.94);
            --washi-border: #d4c8ab;
            --sumi-black: #1a1715;
            --sumi-dark: #2d2825;
            --sumi-gray: #6b635b;
            --sumi-light: #9e9488;
            --hanko-red: #c92a2a;
            --hanko-red-glow: rgba(201, 42, 42, 0.28);
            --enso-gold: #c59b27;
            --enso-gold-glow: rgba(197, 155, 39, 0.25);
            --bamboo-green: #3b5a45;
            --card-shadow: 0 10px 30px rgba(45, 40, 37, 0.12), 0 2px 8px rgba(45, 40, 37, 0.08);
            --transition-smooth: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--washi-bg);
            color: var(--sumi-black);
            font-family: 'Shippori Mincho', 'Outfit', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Washi Paper Grain & Ink Wash Misty Mountains Backdrop */
        .sumi-background-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.85) 0%, transparent 65%),
                radial-gradient(circle at 10% 90%, rgba(201, 42, 42, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(59, 90, 69, 0.05) 0%, transparent 40%),
                linear-gradient(180deg, #f7f2e4 0%, #f0e6ce 100%);
        }

        .sumi-mountains-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 38vh;
            opacity: 0.18;
            pointer-events: none;
        }

        .sumi-bamboo-svg {
            position: absolute;
            top: 0;
            right: 0;
            height: 60vh;
            width: auto;
            opacity: 0.12;
            pointer-events: none;
            transform: scaleX(-1);
        }

        .sumi-bamboo-left-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 50vh;
            width: auto;
            opacity: 0.14;
            pointer-events: none;
        }

        /* Floating Portal Back Button */
        #krazio-floating-back {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 99999;
            width: 42px;
            height: 42px;
            background: rgba(244, 237, 217, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid var(--sumi-dark);
            color: var(--sumi-dark);
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(45, 40, 37, 0.15);
            transition: var(--transition-smooth);
            cursor: pointer;
        }
        #krazio-floating-back:hover {
            background: var(--hanko-red);
            border-color: var(--hanko-red);
            color: #ffffff;
            transform: translateX(-3px) scale(1.06);
            box-shadow: 0 6px 18px var(--hanko-red-glow);
        }

        /* Main Container */
        .zen-main-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        /* Title Header */
        .zen-header {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
        }

        .zen-kanji-badge {
            font-family: 'Yuji Boku', serif;
            font-size: 1.5rem;
            color: var(--hanko-red);
            display: inline-block;
            border: 1.5px solid var(--hanko-red);
            padding: 1px 7px;
            border-radius: 4px;
            margin-bottom: 4px;
            background: rgba(201, 42, 42, 0.05);
            letter-spacing: 2px;
        }

        .zen-title {
            font-family: 'Shippori Mincho', 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--sumi-black);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        .zen-title-symbol {
            font-family: 'Yuji Boku', serif;
            font-size: 2rem;
            font-weight: normal;
        }
        .zen-title-symbol.x-symbol { color: var(--sumi-black); }
        .zen-title-symbol.o-symbol { color: var(--hanko-red); }

        .zen-subtitle {
            font-size: 0.95rem;
            color: var(--sumi-gray);
            margin-top: 2px;
            letter-spacing: 1px;
            font-style: italic;
        }

        /* Controls / Option Bars */
        .zen-controls-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
            width: 100%;
            max-width: 650px;
        }

        .zen-pill-group {
            background: var(--washi-bg-card);
            border: 1.5px solid var(--washi-border);
            padding: 4px;
            border-radius: 28px;
            display: flex;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(45, 40, 37, 0.06);
        }

        .zen-pill-btn {
            background: transparent;
            border: none;
            color: var(--sumi-gray);
            font-family: 'Shippori Mincho', 'Outfit', serif;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .zen-pill-btn:hover {
            color: var(--sumi-black);
            background: rgba(45, 40, 37, 0.05);
        }

        .zen-pill-btn.active {
            background: var(--sumi-dark);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(45, 40, 37, 0.2);
        }

        /* Players Scoreboard & Hanko Seals */
        .zen-score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 580px;
            margin-bottom: 16px;
            gap: 14px;
        }

        .player-scroll-card {
            flex: 1;
            background: var(--washi-bg-card);
            border: 1.5px solid var(--washi-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--card-shadow);
            position: relative;
            transition: var(--transition-smooth);
        }

        .player-scroll-card.active-turn {
            border-color: var(--sumi-dark);
            box-shadow: 0 0 0 2px var(--sumi-dark), 0 8px 24px rgba(45, 40, 37, 0.15);
            transform: translateY(-2px);
            background: #ffffff;
        }

        .player-scroll-card.player-x.active-turn {
            border-color: var(--sumi-black);
            box-shadow: 0 0 0 2px var(--sumi-black), 0 8px 24px rgba(26, 23, 21, 0.18);
        }

        .player-scroll-card.player-o.active-turn {
            border-color: var(--hanko-red);
            box-shadow: 0 0 0 2px var(--hanko-red), 0 8px 24px var(--hanko-red-glow);
        }

        /* Traditional Hanko Seal Stamp */
        .hanko-seal {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Yuji Boku', serif;
            font-size: 1.5rem;
            font-weight: 700;
            flex-shrink: 0;
            position: relative;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.15);
        }

        .hanko-seal.seal-x {
            background: #f0ede6;
            border: 2px solid var(--sumi-black);
            color: var(--sumi-black);
        }

        .hanko-seal.seal-o {
            background: rgba(201, 42, 42, 0.08);
            border: 2px solid var(--hanko-red);
            color: var(--hanko-red);
        }

        .player-info-meta {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .player-name-label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--sumi-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-score-count {
            font-size: 1.6rem;
            font-weight: 900;
            font-family: 'Shippori Mincho', serif;
            color: var(--sumi-black);
            line-height: 1.1;
        }

        .versus-divider {
            font-family: 'Yuji Boku', serif;
            font-size: 1.1rem;
            color: var(--sumi-light);
            font-weight: bold;
            padding: 0 4px;
        }

        /* Turn Indicator Status Bar */
        .zen-status-banner {
            width: 100%;
            max-width: 580px;
            background: var(--washi-bg-card);
            border: 1.5px solid var(--washi-border);
            padding: 10px 18px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--sumi-dark);
            margin-bottom: 16px;
            box-shadow: 0 3px 12px rgba(45, 40, 37, 0.05);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
        }

        .turn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--sumi-dark);
            display: inline-block;
            animation: pulseDot 1.4s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.35); opacity: 1; }
        }

        /* Sumi-e Game Board Container */
        .zen-board-stage {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 20px;
            background: var(--washi-bg-card);
            border: 2.5px solid var(--sumi-dark);
            border-radius: 12px;
            box-shadow: var(--card-shadow), inset 0 0 30px rgba(212, 200, 171, 0.4);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tic-board {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .tic-board.grid-3 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .tic-board.grid-4 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 7px;
        }

        .tic-board.grid-5 {
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
        }

        /* Board Cells */
        .cell {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid var(--washi-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .cell:hover:not(.taken) {
            background: rgba(255, 255, 255, 0.95);
            border-color: var(--sumi-gray);
            box-shadow: inset 0 0 10px rgba(45, 40, 37, 0.05);
            transform: scale(0.98);
        }

        .cell.taken {
            cursor: default;
            background: rgba(255, 255, 255, 0.85);
        }

        .cell.winning-cell {
            background: rgba(201, 42, 42, 0.1) !important;
            border-color: var(--hanko-red) !important;
            animation: winCellGlow 1.5s infinite alternate ease-in-out;
        }

        @keyframes winCellGlow {
            0% { box-shadow: inset 0 0 10px rgba(201, 42, 42, 0.15); }
            100% { box-shadow: inset 0 0 24px rgba(201, 42, 42, 0.35); }
        }

        /* SVG Mark Animations (Sumi-e Brush X & Ensō Circle O) */
        .mark-svg {
            width: 80%;
            height: 80%;
            max-width: 90px;
            max-height: 90px;
            pointer-events: none;
        }

        .brush-x-stroke {
            stroke: var(--sumi-black);
            stroke-width: 9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: drawBrushStroke 0.32s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        }

        .brush-enso-circle {
            stroke: var(--hanko-red);
            stroke-width: 9;
            stroke-linecap: round;
            fill: none;
            stroke-dasharray: 260;
            stroke-dashoffset: 260;
            animation: drawBrushStroke 0.42s cubic-bezier(0.3, 0.85, 0.3, 1) forwards;
            filter: drop-shadow(0 2px 4px var(--hanko-red-glow));
        }

        @keyframes drawBrushStroke {
            to { stroke-dashoffset: 0; }
        }

        /* Strike Line Canvas */
        .strike-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Bottom Action Buttons (Wooden Tablet / Ema Style) */
        .zen-actions-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 440px;
            justify-content: center;
        }

        .zen-btn-primary {
            flex: 2;
            background: var(--sumi-dark);
            color: #ffffff;
            border: 1.5px solid var(--sumi-black);
            padding: 12px 20px;
            font-family: 'Shippori Mincho', serif;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(45, 40, 37, 0.2);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .zen-btn-primary:hover {
            background: var(--sumi-black);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(45, 40, 37, 0.3);
        }

        .zen-btn-secondary {
            flex: 1;
            background: var(--washi-bg-card);
            color: var(--sumi-dark);
            border: 1.5px solid var(--washi-border);
            padding: 12px 14px;
            font-family: 'Shippori Mincho', serif;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(45, 40, 37, 0.06);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .zen-btn-secondary:hover {
            border-color: var(--sumi-dark);
            color: var(--sumi-black);
            background: #ffffff;
            transform: translateY(-2px);
        }

        /* Sound Button */
        .zen-btn-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            padding: 0;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .zen-title { font-size: 1.7rem; }
            .zen-board-stage { max-width: 340px; padding: 8px; }
            .player-scroll-card { padding: 8px 12px; }
            .hanko-seal { width: 36px; height: 36px; font-size: 1.2rem; }
            .player-score-count { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <!-- Washi & Sumi-e Backdrop Atmosphere -->
    <div class="sumi-background-layer">
        <!-- Mountain silhouettes -->
        <svg class="sumi-mountains-svg" viewBox="0 0 1200 400" preserveAspectRatio="none">
            <path d="M0,400 L0,220 Q180,120 380,240 T780,180 Q980,260 1200,160 L1200,400 Z" fill="#2d2825" opacity="0.3" />
            <path d="M0,400 L0,280 Q250,180 520,300 T950,220 Q1080,280 1200,240 L1200,400 Z" fill="#1a1715" opacity="0.5" />
        </svg>
        <!-- Bamboo silhouettes -->
        <svg class="sumi-bamboo-svg" viewBox="0 0 200 600" preserveAspectRatio="xMidYMid meet">
            <path d="M160,0 L160,600 M160,120 Q190,100 200,70 M160,240 Q120,210 100,190 M160,380 Q195,350 210,320 M160,490 Q120,460 90,430" stroke="#1a1715" stroke-width="4" fill="none" stroke-linecap="round" />
            <path d="M120,60 L120,600 M120,180 Q150,150 170,120 M120,310 Q80,280 60,250 M120,440 Q150,400 170,360" stroke="#2d2825" stroke-width="3.5" fill="none" stroke-linecap="round" />
        </svg>
        <svg class="sumi-bamboo-left-svg" viewBox="0 0 200 600" preserveAspectRatio="xMidYMid meet">
            <path d="M40,0 L40,600 M40,140 Q10,110 0,90 M40,280 Q80,250 100,220 M40,420 Q10,380 0,350" stroke="#1a1715" stroke-width="3.5" fill="none" stroke-linecap="round" />
        </svg>
    </div>

    <!-- Floating Portal Back Navigation -->
    <a href="../index.html" id="krazio-floating-back" title="Back to Portal" aria-label="Back" onclick="exitToPortal(); return false;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </a>

    <!-- Main Game Container -->
    <div class="zen-main-container">
        <!-- Header -->
        <header class="zen-header">
            <div class="zen-kanji-badge">水墨画 • 禅</div>
            <h1 class="zen-title">
                <span class="zen-title-symbol x-symbol">✕</span>
                <span>SUMI-E TAC TOE</span>
                <span class="zen-title-symbol o-symbol">◯</span>
            </h1>
            <p class="zen-subtitle">Traditional Japanese Calligraphy Brush Battle</p>
        </header>

        <!-- Controls: Game Mode & Grid Size -->
        <div class="zen-controls-panel">
            <!-- Mode Selector -->
            <div class="zen-pill-group" role="tablist">
                <button class="zen-pill-btn active" id="mode-bot" onclick="setMode('bot')">
                    🤖 vs Zen Bot
                </button>
                <button class="zen-pill-btn" id="mode-pvp" onclick="setMode('pvp')">
                    👥 Pass & Play
                </button>
            </div>

            <!-- Difficulty Selector (Bot Mode) -->
            <div class="zen-pill-group" id="difficulty-group">
                <button class="zen-pill-btn" id="diff-easy" onclick="setDifficulty('easy')">
                    🍃 Novice
                </button>
                <button class="zen-pill-btn active" id="diff-medium" onclick="setDifficulty('medium')">
                    🥋 Ronin
                </button>
                <button class="zen-pill-btn" id="diff-hard" onclick="setDifficulty('hard')">
                    ⚔️ Shogun
                </button>
            </div>

            <!-- Grid Size Selector -->
            <div class="zen-pill-group">
                <button class="zen-pill-btn active" id="grid-3" onclick="setGridSize(3)">
                    3×3
                </button>
                <button class="zen-pill-btn" id="grid-4" onclick="setGridSize(4)">
                    4×4
                </button>
                <button class="zen-pill-btn" id="grid-5" onclick="setGridSize(5)">
                    5×5
                </button>
            </div>
        </div>

        <!-- Scoreboard & Hanko Seals -->
        <div class="zen-score-row">
            <!-- Player X -->
            <div class="player-scroll-card player-x active-turn" id="card-player-x">
                <div class="hanko-seal seal-x">墨</div>
                <div class="player-info-meta">
                    <span class="player-name-label" id="label-player-x">Player (X)</span>
                    <span class="player-score-count" id="score-player-x">0</span>
                </div>
            </div>

            <div class="versus-divider">対</div>

            <!-- Player O / Bot -->
            <div class="player-scroll-card player-o" id="card-player-o">
                <div class="hanko-seal seal-o">禅</div>
                <div class="player-info-meta">
                    <span class="player-name-label" id="label-player-o">Zen Master (O)</span>
                    <span class="player-score-count" id="score-player-o">0</span>
                </div>
            </div>
        </div>

        <!-- Status Banner -->
        <div class="zen-status-banner" id="status-banner">
            <span class="turn-dot"></span>
            <span id="status-text">Your Turn (Sumi Black X) — Place your brush stroke</span>
        </div>

        <!-- Board Stage -->
        <div class="zen-board-stage">
            <canvas id="strike-canvas" class="strike-canvas"></canvas>
            <div id="board" class="tic-board grid-3"></div>
        </div>

        <!-- Action Buttons -->
        <div class="zen-actions-row">
            <button class="zen-btn-primary" id="btn-restart" onclick="restartRound()">
                🔄 New Round (新局)
            </button>
            <button class="zen-btn-secondary" id="btn-reset-scores" onclick="resetScores()">
                ⚖️ Reset
            </button>
            <button class="zen-btn-secondary zen-btn-icon" id="btn-toggle-sound" onclick="toggleSound()" title="Toggle Sound">
                🔊
            </button>
        </div>
    </div>

    <!-- ==========================================
         SUMI-E ZEN AUDIO & GAME LOGIC
         ========================================== -->
    <script>
        /**
         * Authentic Web Audio API Synthesizer for Sumi-e Zen Soundscapes
         */
        class SumiAudioEngine {
            constructor() {
                this.ctx = null;
                this.muted = localStorage.getItem('sumi_sound_muted') === 'true';
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                localStorage.setItem('sumi_sound_muted', this.muted.toString());
                return this.muted;
            }

            // 1. Calligraphy Brush Stroke (Soft paper friction & ink whoosh)
            playBrushStroke() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    // Pink noise buffer for paper friction
                    const bufferSize = this.ctx.sampleRate * 0.15;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    let b0 = 0, b1 = 0, b2 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        const white = Math.random() * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        output[i] = (b0 + b1 + b2) * 0.25;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + 0.15);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start(now);
                } catch(e) {}
            }

            // 2. Koto Pentatonic String Pluck (Turn mark feedback)
            playKotoPluck(isPlayerX = true) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const freq = isPlayerX ? 293.66 : 440; // D4 or A4 in Hirajoshi scale
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.98, now + 0.35);

                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.36);
                } catch(e) {}
            }

            // 3. Resonant Zen Bell / Singing Bowl (Victory Fanfare)
            playZenBell() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const frequencies = [587.33, 880, 1174.66, 1760];
                    frequencies.forEach((f, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now);
                        const initialVol = 0.22 / (idx + 1);
                        gain.gain.setValueAtTime(initialVol, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 1.85);
                    });
                } catch(e) {}
            }

            // 4. Wooden Hyoshigi Clapper (Button click & round resets)
            playClapper() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1400, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);

                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } catch(e) {}
            }
        }

        const audio = new SumiAudioEngine();

        // Game State Variables
        let board = [];
        let gridSize = 3;
        let winStreakReq = 3;
        let currentPlayer = 'X';
        let isGameActive = true;
        let gameMode = 'bot'; // 'bot' | 'pvp'
        let botDifficulty = 'medium'; // 'easy' | 'medium' | 'hard'
        let isBotThinking = false;

        const scores = { X: 0, O: 0, draws: 0 };

        // DOM Element Cache
        const boardEl = document.getElementById('board');
        const strikeCanvas = document.getElementById('strike-canvas');
        const statusTextEl = document.getElementById('status-text');
        const cardPlayerX = document.getElementById('card-player-x');
        const cardPlayerO = document.getElementById('card-player-o');
        const labelPlayerO = document.getElementById('label-player-o');
        const scorePlayerX = document.getElementById('score-player-x');
        const scorePlayerO = document.getElementById('score-player-o');
        const btnToggleSound = document.getElementById('btn-toggle-sound');
        const diffGroup = document.getElementById('difficulty-group');

        function initGame() {
            createBoard();
            updateUI();
            if (btnToggleSound) {
                btnToggleSound.textContent = audio.muted ? '🔇' : '🔊';
            }
        }

        function createBoard() {
            board = Array(gridSize * gridSize).fill(null);
            isGameActive = true;
            isBotThinking = false;
            currentPlayer = 'X';

            boardEl.className = `tic-board grid-${gridSize}`;
            boardEl.innerHTML = '';

            const strikeCtx = strikeCanvas.getContext('2d');
            strikeCanvas.width = strikeCanvas.offsetWidth;
            strikeCanvas.height = strikeCanvas.offsetHeight;
            strikeCtx.clearRect(0, 0, strikeCanvas.width, strikeCanvas.height);

            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }

            updateUI();
        }

        function handleCellClick(index) {
            if (!isGameActive || board[index] !== null || isBotThinking) return;

            makeMove(index, currentPlayer);

            const winResult = checkWin(board, gridSize, winStreakReq);
            if (winResult) {
                handleWin(winResult);
                return;
            }

            if (checkDraw(board)) {
                handleDraw();
                return;
            }

            // Switch Turn
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateUI();

            if (gameMode === 'bot' && currentPlayer === 'O' && isGameActive) {
                isBotThinking = true;
                updateUI();
                setTimeout(() => {
                    const botMove = getBotMove();
                    if (botMove !== null) {
                        makeMove(botMove, 'O');
                        const botWin = checkWin(board, gridSize, winStreakReq);
                        if (botWin) {
                            handleWin(botWin);
                        } else if (checkDraw(board)) {
                            handleDraw();
                        } else {
                            currentPlayer = 'X';
                        }
                    }
                    isBotThinking = false;
                    updateUI();
                }, botDifficulty === 'easy' ? 300 : botDifficulty === 'medium' ? 450 : 550);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = boardEl.children[index];
            cell.classList.add('taken');

            audio.playBrushStroke();
            audio.playKotoPluck(player === 'X');

            if (player === 'X') {
                // Sumi-e Calligraphic Brush Cross (✕)
                cell.innerHTML = `
                    <svg viewBox="0 0 100 100" class="mark-svg">
                        <path d="M 20,20 Q 50,48 80,80" class="brush-x-stroke" />
                        <path d="M 80,20 Q 52,50 20,80" class="brush-x-stroke" style="animation-delay: 0.12s;" />
                    </svg>
                `;
            } else {
                // Authentic Ensō (円相) Zen Brush Circle (◯)
                cell.innerHTML = `
                    <svg viewBox="0 0 100 100" class="mark-svg">
                        <path d="M 50,15 A 35,35 0 1,1 48,15" class="brush-enso-circle" />
                    </svg>
                `;
            }
        }

        function checkWin(b, size, req) {
            const lines = [];

            // 1. Rows
            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - req; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push(r * size + (c + k));
                    lines.push(line);
                }
            }

            // 2. Columns
            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - req; r++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + c);
                    lines.push(line);
                }
            }

            // 3. Diagonals (Top-Left to Bottom-Right)
            for (let r = 0; r <= size - req; r++) {
                for (let c = 0; c <= size - req; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + (c + k));
                    lines.push(line);
                }
            }

            // 4. Anti-Diagonals (Top-Right to Bottom-Left)
            for (let r = 0; r <= size - req; r++) {
                for (let c = req - 1; c < size; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + (c - k));
                    lines.push(line);
                }
            }

            for (const line of lines) {
                const first = b[line[0]];
                if (first && line.every(idx => b[idx] === first)) {
                    return { winner: first, line };
                }
            }

            return null;
        }

        function checkDraw(b) {
            return b.every(cell => cell !== null);
        }

        function handleWin(winResult) {
            isGameActive = false;
            scores[winResult.winner]++;
            audio.playZenBell();

            // Highlight Winning Cells
            winResult.line.forEach(idx => {
                if (boardEl.children[idx]) {
                    boardEl.children[idx].classList.add('winning-cell');
                }
            });

            // Draw Sumi-e Red Vermilion Brush Slash
            drawStrikeLine(winResult.line);

            const winnerName = winResult.winner === 'X' 
                ? (gameMode === 'bot' ? 'You (Sumi X)' : 'Player X') 
                : (gameMode === 'bot' ? 'Zen Master (O)' : 'Player O');

            statusTextEl.innerHTML = `🏆 <strong style="color: var(--hanko-red);">${winnerName}</strong> Achieves Victory! (勝利)`;
            updateScoreUI();
        }

        function handleDraw() {
            isGameActive = false;
            scores.draws++;
            audio.playClapper();
            statusTextEl.innerHTML = `⚖️ <strong>Zen Harmony!</strong> It is a peaceful Draw (引き分け)`;
            updateScoreUI();
        }

        function drawStrikeLine(lineIndices) {
            const firstCell = boardEl.children[lineIndices[0]];
            const lastCell = boardEl.children[lineIndices[lineIndices.length - 1]];
            if (!firstCell || !lastCell) return;

            const boardRect = boardEl.getBoundingClientRect();
            const firstRect = firstCell.getBoundingClientRect();
            const lastRect = lastCell.getBoundingClientRect();

            const x1 = firstRect.left + firstRect.width / 2 - boardRect.left;
            const y1 = firstRect.top + firstRect.height / 2 - boardRect.top;
            const x2 = lastRect.left + lastRect.width / 2 - boardRect.left;
            const y2 = lastRect.top + lastRect.height / 2 - boardRect.top;

            const ctx = strikeCanvas.getContext('2d');
            strikeCanvas.width = strikeCanvas.offsetWidth;
            strikeCanvas.height = strikeCanvas.offsetHeight;

            ctx.save();
            ctx.strokeStyle = '#c92a2a';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(201, 42, 42, 0.4)';
            ctx.shadowBlur = 12;

            let progress = 0;
            const animateStrike = () => {
                progress += 0.08;
                ctx.clearRect(0, 0, strikeCanvas.width, strikeCanvas.height);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x1 + (x2 - x1) * Math.min(1, progress), y1 + (y2 - y1) * Math.min(1, progress));
                ctx.stroke();

                if (progress < 1) {
                    requestAnimationFrame(animateStrike);
                }
            };
            requestAnimationFrame(animateStrike);
            ctx.restore();
        }

        // ==========================================
        // AI BOT LOGIC (Novice / Ronin / Shogun Minimax)
        // ==========================================
        function getBotMove() {
            const emptyIndices = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (emptyIndices.length === 0) return null;

            // 1. Novice Monk (Casual)
            if (botDifficulty === 'easy') {
                return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }

            // Check Immediate Winning Move for O
            for (const idx of emptyIndices) {
                const temp = [...board];
                temp[idx] = 'O';
                if (checkWin(temp, gridSize, winStreakReq)) return idx;
            }

            // Check Immediate Block Move for X
            for (const idx of emptyIndices) {
                const temp = [...board];
                temp[idx] = 'X';
                if (checkWin(temp, gridSize, winStreakReq)) return idx;
            }

            // 2. Wandering Ronin (Medium)
            if (botDifficulty === 'medium') {
                const center = Math.floor((gridSize * gridSize) / 2);
                if (emptyIndices.includes(center) && Math.random() > 0.3) return center;
                return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }

            // 3. Shogun Grandmaster (Minimax for 3x3, Heuristic for 4x4/5x5)
            if (gridSize === 3) {
                let bestScore = -Infinity;
                let bestMove = emptyIndices[0];
                for (const idx of emptyIndices) {
                    board[idx] = 'O';
                    const score = minimax(board, 0, false, -Infinity, Infinity);
                    board[idx] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = idx;
                    }
                }
                return bestMove;
            } else {
                // Strategic heuristic scoring for 4x4 and 5x5
                let bestScore = -Infinity;
                let bestMove = emptyIndices[0];
                const center = Math.floor((gridSize * gridSize) / 2);

                for (const idx of emptyIndices) {
                    let score = 0;
                    if (idx === center) score += 4;
                    const r = Math.floor(idx / gridSize);
                    const c = idx % gridSize;
                    if ((r === 1 || r === gridSize - 2) && (c === 1 || c === gridSize - 2)) score += 2;

                    board[idx] = 'O';
                    score += evaluateBoard(board, 'O');
                    board[idx] = null;

                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = idx;
                    }
                }
                return bestMove;
            }
        }

        function minimax(b, depth, isMaximizing, alpha, beta) {
            const winResult = checkWin(b, 3, 3);
            if (winResult) return winResult.winner === 'O' ? (10 - depth) : (depth - 10);
            if (checkDraw(b) || depth >= 6) return 0;

            const emptyIndices = b.map((v, i) => v === null ? i : null).filter(v => v !== null);

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (const idx of emptyIndices) {
                    b[idx] = 'O';
                    const ev = minimax(b, depth + 1, false, alpha, beta);
                    b[idx] = null;
                    maxEval = Math.max(maxEval, ev);
                    alpha = Math.max(alpha, ev);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (const idx of emptyIndices) {
                    b[idx] = 'X';
                    const ev = minimax(b, depth + 1, true, alpha, beta);
                    b[idx] = null;
                    minEval = Math.min(minEval, ev);
                    beta = Math.min(beta, ev);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard(b, player) {
            let score = 0;
            const opp = player === 'O' ? 'X' : 'O';
            const winRes = checkWin(b, gridSize, winStreakReq);
            if (winRes) return winRes.winner === player ? 100 : -100;
            return score;
        }

        // ==========================================
        // UI UPDATES & EVENT HANDLERS
        // ==========================================
        function updateUI() {
            if (isGameActive) {
                if (isBotThinking) {
                    statusTextEl.innerHTML = `🧘 <span style="color: var(--hanko-red);">Zen Master is contemplating the brush stroke...</span>`;
                } else {
                    const currentName = currentPlayer === 'X' 
                        ? (gameMode === 'bot' ? 'Your Turn (Sumi X)' : 'Player X’s Turn') 
                        : (gameMode === 'bot' ? 'Zen Master (O)' : 'Player O’s Turn');
                    statusTextEl.innerHTML = `<span class="turn-dot"></span> <span>${currentName} — Place your mark</span>`;
                }
            }

            if (currentPlayer === 'X') {
                cardPlayerX.classList.add('active-turn');
                cardPlayerO.classList.remove('active-turn');
            } else {
                cardPlayerO.classList.add('active-turn');
                cardPlayerX.classList.remove('active-turn');
            }

            labelPlayerO.textContent = gameMode === 'bot' ? 'Zen Master (O)' : 'Player (O)';
            updateScoreUI();
        }

        function updateScoreUI() {
            scorePlayerX.textContent = scores.X;
            scorePlayerO.textContent = scores.O;
        }

        function setMode(mode) {
            gameMode = mode;
            audio.playClapper();
            document.getElementById('mode-bot').classList.toggle('active', mode === 'bot');
            document.getElementById('mode-pvp').classList.toggle('active', mode === 'pvp');
            diffGroup.style.display = mode === 'bot' ? 'flex' : 'none';
            resetScores();
            createBoard();
        }

        function setDifficulty(diff) {
            botDifficulty = diff;
            audio.playClapper();
            ['easy', 'medium', 'hard'].forEach(d => {
                document.getElementById(`diff-${d}`).classList.toggle('active', d === diff);
            });
            createBoard();
        }

        function setGridSize(size) {
            gridSize = size;
            winStreakReq = size === 3 ? 3 : 4;
            audio.playClapper();
            [3, 4, 5].forEach(s => {
                document.getElementById(`grid-${s}`).classList.toggle('active', s === size);
            });
            resetScores();
            createBoard();
        }

        function restartRound() {
            audio.playClapper();
            createBoard();
        }

        function resetScores() {
            audio.playClapper();
            scores.X = 0;
            scores.O = 0;
            scores.draws = 0;
            createBoard();
        }

        function toggleSound() {
            const isMuted = audio.toggleMute();
            if (btnToggleSound) {
                btnToggleSound.textContent = isMuted ? '🔇' : '🔊';
            }
        }

        // Global functions for inline onclick attributes
        window.restartRound = restartRound;
        window.resetScores = resetScores;
        window.toggleSound = toggleSound;
        window.setMode = setMode;
        window.setDifficulty = setDifficulty;
        window.setGridSize = setGridSize;

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initGame);
        window.addEventListener('resize', () => {
            if (strikeCanvas) {
                strikeCanvas.width = strikeCanvas.offsetWidth;
                strikeCanvas.height = strikeCanvas.offsetHeight;
            }
        });
    </script>
