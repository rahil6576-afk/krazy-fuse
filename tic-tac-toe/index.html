<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe: Neon Arena ❌⭕ — krazio games</title>
    <!-- Favicon -->
    <link rel="icon" href="../krazio-icon.svg" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #080b16;
            --card-bg: rgba(18, 24, 43, 0.85);
            --border-glow: rgba(99, 102, 241, 0.35);
            --cyan-glow: #00f0ff;
            --cyan-glow-dim: rgba(0, 240, 255, 0.25);
            --pink-glow: #ff007f;
            --pink-glow-dim: rgba(255, 0, 127, 0.25);
            --gold-glow: #ffd700;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15), transparent 60%),
                radial-gradient(circle at 10% 85%, rgba(0, 240, 255, 0.08), transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(255, 0, 127, 0.08), transparent 45%);
        }

        /* Floating Back Navigation */
        #krazio-floating-back {
            position: fixed;
            top: 14px;
            left: 16px;
            z-index: 99999;
            width: 40px;
            height: 40px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        #krazio-floating-back:hover {
            background: rgba(249, 115, 22, 0.9);
            border-color: #f97316;
            color: #ffffff;
            transform: translateX(-3px) scale(1.08);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.6);
        }

        /* Header Bar */
        .game-header {
            width: 100%;
            max-width: 680px;
            padding: 65px 20px 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #00f0ff 0%, #a855f7 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Mode & Difficulty Selector Pills */
        .controls-panel {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px;
            margin: 12px 0 16px 0;
        }

        .pill-group {
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 4px;
            gap: 4px;
            backdrop-filter: blur(8px);
        }

        .mode-btn, .diff-btn, .grid-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 8px 12px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-btn.active, .diff-btn.active, .grid-btn.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            box-shadow: 0 2px 14px rgba(99, 102, 241, 0.5);
        }

        /* Player Turn & Scoreboard Banner */
        .match-status-bar {
            width: 100%;
            max-width: 520px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
        }

        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .player-card.active-turn {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .player-card.p-x.active-turn {
            border: 1px solid var(--cyan-glow);
            box-shadow: 0 0 20px var(--cyan-glow-dim);
        }

        .player-card.p-o.active-turn {
            border: 1px solid var(--pink-glow);
            box-shadow: 0 0 20px var(--pink-glow-dim);
        }

        .player-label {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .player-score {
            font-size: 1.6rem;
            font-weight: 900;
        }

        .p-x .player-score { color: var(--cyan-glow); text-shadow: 0 0 10px var(--cyan-glow-dim); }
        .p-o .player-score { color: var(--pink-glow); text-shadow: 0 0 10px var(--pink-glow-dim); }

        .vs-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .turn-announcer {
            font-size: 0.95rem;
            font-weight: 900;
            color: #fff;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.1);
            letter-spacing: 0.5px;
            animation: pulseGlow 1.8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .ties-count {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 700;
        }

        /* 3D Glass Board Arena */
        .board-container {
            position: relative;
            width: 90vw;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            background: var(--card-bg);
            border: 2px solid var(--border-glow);
            border-radius: 28px;
            padding: 14px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tic-board {
            width: 100%;
            height: 100%;
            display: grid;
            gap: 12px;
            position: relative;
        }

        .tic-board.grid-3 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .tic-board.grid-4 {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
        }

        .tic-board.grid-5 {
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
        }

        .cell {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .cell:hover:not(.taken) {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: scale(1.04);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .cell:active:not(.taken) {
            transform: scale(0.96);
        }

        .cell.winning-cell {
            background: rgba(255, 215, 0, 0.2) !important;
            border-color: var(--gold-glow) !important;
            animation: winCellPulse 1s infinite alternate;
        }

        @keyframes winCellPulse {
            0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.7); transform: scale(1.05); }
        }

        /* SVG Mark Glyphs */
        .mark-svg {
            width: 70%;
            height: 70%;
        }

        /* X Drawing Animation */
        .path-x {
            stroke: var(--cyan-glow);
            stroke-width: 14;
            stroke-linecap: round;
            fill: none;
            filter: drop-shadow(0 0 12px var(--cyan-glow));
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawLine 0.28s ease-out forwards;
        }

        /* O Drawing Animation */
        .path-o {
            stroke: var(--pink-glow);
            stroke-width: 14;
            stroke-linecap: round;
            fill: none;
            filter: drop-shadow(0 0 12px var(--pink-glow));
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: drawLine 0.32s ease-out forwards;
        }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        /* Winning Laser Line Canvas Overlay */
        #strike-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 28px;
            z-index: 20;
        }

        /* Bottom Control Buttons */
        .actions-row {
            display: flex;
            gap: 12px;
            margin: 20px 0 30px 0;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            background: rgba(79, 70, 229, 0.9);
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
        }

        .btn-restart {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            box-shadow: 0 4px 18px rgba(79, 70, 229, 0.5);
        }

        /* Confetti Container */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        @media (max-width: 480px) {
            .game-title { font-size: 1.8rem; }
            .board-container { max-width: 360px; }
            .mode-btn, .diff-btn, .grid-btn { font-size: 0.78rem; padding: 6px 8px; }
        }
    </style>
</head>
<body>
    <!-- Simple Backward Arrow Button -->
    <a href="../index.html" id="krazio-floating-back" title="Back to Portal" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
    </a>

    <!-- Confetti & Win Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Header Section -->
    <header class="game-header">
        <h1 class="game-title">
            <span>❌</span>
            <span>NEON TAC TOE</span>
            <span>⭕</span>
        </h1>
        <p class="game-subtitle">Classic & Expanded Strategy • Play with Bot or Pass on 1 Device</p>
    </header>

    <!-- Mode & Options Panel -->
    <div class="controls-panel">
        <!-- Opponent Mode -->
        <div class="pill-group" id="mode-group">
            <button class="mode-btn active" data-mode="bot">🤖 Play vs Bot</button>
            <button class="mode-btn" data-mode="pass">👥 Pass & Play</button>
        </div>

        <!-- Bot Difficulty (Shown when in Bot mode) -->
        <div class="pill-group" id="diff-group">
            <button class="diff-btn" data-diff="easy">Casual 🟢</button>
            <button class="diff-btn active" data-diff="medium">Smart 🟡</button>
            <button class="diff-btn" data-diff="impossible">Unbeatable 🔴</button>
        </div>

        <!-- Grid Size -->
        <div class="pill-group" id="grid-group">
            <button class="grid-btn active" data-grid="3">3×3 Classic (Match 3)</button>
            <button class="grid-btn" data-grid="4">4×4 Arena (Match 4)</button>
            <button class="grid-btn" data-grid="5">5×5 Master (Match 4)</button>
        </div>
    </div>

    <!-- Match Scoreboard & Turn Status -->
    <div class="match-status-bar">
        <div class="player-card p-x active-turn" id="card-p-x">
            <span class="player-label" id="label-p-x">PLAYER (X)</span>
            <span class="player-score" id="score-p-x">0</span>
        </div>

        <div class="vs-divider">
            <div class="turn-announcer" id="turn-announcer">X's Turn ⚡</div>
            <span class="ties-count" id="ties-count">0 Ties</span>
        </div>

        <div class="player-card p-o" id="card-p-o">
            <span class="player-label" id="label-p-o">BOT (O)</span>
            <span class="player-score" id="score-p-o">0</span>
        </div>
    </div>

    <!-- 3D Board Container -->
    <div class="board-container">
        <div class="tic-board grid-3" id="tic-board"></div>
        <canvas id="strike-canvas"></canvas>
    </div>

    <!-- Action Buttons -->
    <div class="actions-row">
        <button class="action-btn btn-restart" id="btn-restart">
            <span>🔄 New Round</span>
        </button>
        <button class="action-btn" id="btn-reset-scores">
            <span>🧹 Reset Score</span>
        </button>
    </div>

    <script>
        // Web Audio Synthesizer for Retro Neon Sound FX
        class NeonAudio {
            constructor() {
                this.ctx = null;
                this.initOnInteraction();
            }

            initOnInteraction() {
                const startAudio = () => {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                };
                window.addEventListener('click', startAudio, { once: true });
                window.addEventListener('touchstart', startAudio, { once: true });
            }

            ensureContext() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playMark(isX) {
                this.ensureContext();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isX ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(isX ? 520 : 380, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isX ? 780 : 260, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playBotThinking() {
                this.ensureContext();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(330, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playWin() {
                this.ensureContext();
                if (!this.ctx) return;
                const notes = [440, 554, 659, 880];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.09);
                    gain.gain.setValueAtTime(0.22, this.ctx.currentTime + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.09 + 0.28);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.09);
                    osc.stop(this.ctx.currentTime + i * 0.09 + 0.28);
                });
            }

            playDraw() {
                this.ensureContext();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(160, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const audio = new NeonAudio();

        // Game State Engine
        let gameMode = 'bot'; // 'bot' | 'pass'
        let botDifficulty = 'medium'; // 'easy' | 'medium' | 'impossible'
        let gridSize = 3;
        let winStreakReq = 3; // 3 on 3x3, 4 on 4x4 and 5x5
        let board = [];
        let currentPlayer = 'X';
        let isGameActive = true;
        let isBotThinking = false;
        let scores = { X: 0, O: 0, ties: 0 };

        const boardEl = document.getElementById('tic-board');
        const turnAnnouncer = document.getElementById('turn-announcer');
        const cardPX = document.getElementById('card-p-x');
        const cardPO = document.getElementById('card-p-o');
        const labelPX = document.getElementById('label-p-x');
        const labelPO = document.getElementById('label-p-o');
        const scorePX = document.getElementById('score-p-x');
        const scorePO = document.getElementById('score-p-o');
        const tiesCount = document.getElementById('ties-count');
        const diffGroup = document.getElementById('diff-group');
        const strikeCanvas = document.getElementById('strike-canvas');
        const confettiCanvas = document.getElementById('confetti-canvas');

        // Confetti System
        let confettiParticles = [];
        function triggerConfetti() {
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            confettiParticles = [];

            const colors = ['#00f0ff', '#ff007f', '#ffd700', '#a855f7', '#38b000'];
            for (let i = 0; i < 80; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12,
                    opacity: 1
                });
            }

            function updateConfetti() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let alive = false;
                confettiParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.45; // gravity
                    p.rot += p.vRot;
                    p.opacity -= 0.014;
                    if (p.opacity > 0) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rot * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });
                if (alive) requestAnimationFrame(updateConfetti);
                else ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
            requestAnimationFrame(updateConfetti);
        }

        // Initialize Board
        function initBoard() {
            winStreakReq = gridSize === 3 ? 3 : 4;
            board = Array(gridSize * gridSize).fill(null);
            currentPlayer = 'X';
            isGameActive = true;
            isBotThinking = false;

            boardEl.className = `tic-board grid-${gridSize}`;
            boardEl.innerHTML = '';

            const strikeCtx = strikeCanvas.getContext('2d');
            strikeCanvas.width = strikeCanvas.offsetWidth;
            strikeCanvas.height = strikeCanvas.offsetHeight;
            strikeCtx.clearRect(0, 0, strikeCanvas.width, strikeCanvas.height);

            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }

            updateUI();
        }

        function ensureFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const el = document.documentElement;
                const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                if (req) req.call(el).catch(() => {});
            }
        }

        function handleCellClick(index) {
            ensureFullScreen();
            if (!isGameActive || board[index] !== null || isBotThinking) return;

            makeMove(index, currentPlayer);

            const winResult = checkWin(board, gridSize, winStreakReq);
            if (winResult) {
                handleWin(winResult);
                return;
            }

            if (checkDraw(board)) {
                handleDraw();
                return;
            }

            // Switch Turn
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateUI();

            if (gameMode === 'bot' && currentPlayer === 'O' && isGameActive) {
                isBotThinking = true;
                updateUI();
                audio.playBotThinking();
                setTimeout(() => {
                    const botMove = getBotMove();
                    if (botMove !== null) {
                        makeMove(botMove, 'O');
                        const botWin = checkWin(board, gridSize, winStreakReq);
                        if (botWin) {
                            handleWin(botWin);
                        } else if (checkDraw(board)) {
                            handleDraw();
                        } else {
                            currentPlayer = 'X';
                        }
                    }
                    isBotThinking = false;
                    updateUI();
                }, botDifficulty === 'easy' ? 300 : botDifficulty === 'medium' ? 450 : 550);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = boardEl.children[index];
            cell.classList.add('taken');

            if (player === 'X') {
                cell.innerHTML = `
                    <svg viewBox="0 0 100 100" class="mark-svg">
                        <line x1="18" y1="18" x2="82" y2="82" class="path-x" />
                        <line x1="82" y1="18" x2="18" y2="82" class="path-x" style="animation-delay: 0.12s;" />
                    </svg>
                `;
                audio.playMark(true);
            } else {
                cell.innerHTML = `
                    <svg viewBox="0 0 100 100" class="mark-svg">
                        <circle cx="50" cy="50" r="34" class="path-o" />
                    </svg>
                `;
                audio.playMark(false);
            }
        }

        function checkWin(b, size, req) {
            const lines = [];

            // 1. Rows
            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - req; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push(r * size + (c + k));
                    lines.push(line);
                }
            }

            // 2. Columns
            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - req; r++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + c);
                    lines.push(line);
                }
            }

            // 3. Diagonals (Top-Left to Bottom-Right)
            for (let r = 0; r <= size - req; r++) {
                for (let c = 0; c <= size - req; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + (c + k));
                    lines.push(line);
                }
            }

            // 4. Anti-Diagonals (Top-Right to Bottom-Left)
            for (let r = 0; r <= size - req; r++) {
                for (let c = req - 1; c < size; c++) {
                    const line = [];
                    for (let k = 0; k < req; k++) line.push((r + k) * size + (c - k));
                    lines.push(line);
                }
            }

            for (const line of lines) {
                const first = b[line[0]];
                if (first && line.every(idx => b[idx] === first)) {
                    return { winner: first, line };
                }
            }

            return null;
        }

        function checkDraw(b) {
            return b.every(cell => cell !== null);
        }

        function handleWin(winResult) {
            isGameActive = false;
            scores[winResult.winner]++;

            winResult.line.forEach(idx => {
                if (boardEl.children[idx]) {
                    boardEl.children[idx].classList.add('winning-cell');
                }
            });

            triggerConfetti();
            audio.playWin();
            updateUI(winResult.winner + ' Wins! 🎉');
        }

        function handleDraw() {
            isGameActive = false;
            scores.ties++;
            audio.playDraw();
            updateUI("It's a Tie! 🤝");
        }

        function updateUI(customMessage = null) {
            scorePX.textContent = scores.X;
            scorePO.textContent = scores.O;
            tiesCount.textContent = `${scores.ties} Ties`;

            labelPX.textContent = gameMode === 'bot' ? 'PLAYER (X)' : 'PLAYER 1 (X)';
            labelPO.textContent = gameMode === 'bot' ? `BOT [${botDifficulty.toUpperCase()}] (O)` : 'PLAYER 2 (O)';

            if (customMessage) {
                turnAnnouncer.textContent = customMessage;
                cardPX.classList.remove('active-turn');
                cardPO.classList.remove('active-turn');
            } else if (isBotThinking) {
                turnAnnouncer.textContent = 'Bot Thinking... 🤖';
                cardPX.classList.remove('active-turn');
                cardPO.classList.add('active-turn');
            } else {
                turnAnnouncer.textContent = currentPlayer === 'X' ? (gameMode === 'bot' ? "Your Turn (X) ⚡" : "P1 Turn (X) ⚡") : (gameMode === 'bot' ? "Bot Turn (O)" : "P2 Turn (O) ⚡");
                cardPX.classList.toggle('active-turn', currentPlayer === 'X');
                cardPO.classList.toggle('active-turn', currentPlayer === 'O');
            }
        }

        // Smart Bot Logic (Easy, Medium, Minimax Impossible)
        function getBotMove() {
            const availableMoves = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (availableMoves.length === 0) return null;

            // 1. Easy: Mostly Random Moves
            if (botDifficulty === 'easy') {
                return availableMoves[Math.floor(Math.random() * availableMoves.length)];
            }

            // 2. Check for Immediate Bot Win Move
            for (const move of availableMoves) {
                const clone = [...board];
                clone[move] = 'O';
                if (checkWin(clone, gridSize, winStreakReq)) return move;
            }

            // 3. Check for Immediate Human Block Move
            for (const move of availableMoves) {
                const clone = [...board];
                clone[move] = 'X';
                if (checkWin(clone, gridSize, winStreakReq)) return move;
            }

            // Medium Mode: 40% Chance to pick center or smart corner, else random
            if (botDifficulty === 'medium') {
                const center = Math.floor(board.length / 2);
                if (board[center] === null && Math.random() < 0.7) return center;
                return availableMoves[Math.floor(Math.random() * availableMoves.length)];
            }

            // 4. Impossible (Unbeatable Minimax for 3x3)
            if (gridSize === 3) {
                return getBestMinimaxMove();
            } else {
                // Heuristic Evaluation for 4x4 / 5x5
                return getHeuristicMove(availableMoves);
            }
        }

        function getBestMinimaxMove() {
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === null) {
                    board[i] = 'O';
                    const score = minimax(board, 0, false, -Infinity, Infinity);
                    board[i] = null;
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(b, depth, isMaximizing, alpha, beta) {
            const result = checkWin(b, 3, 3);
            if (result) return result.winner === 'O' ? (10 - depth) : (depth - 10);
            if (checkDraw(b) || depth >= 6) return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < b.length; i++) {
                    if (b[i] === null) {
                        b[i] = 'O';
                        const evaluation = minimax(b, depth + 1, false, alpha, beta);
                        b[i] = null;
                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < b.length; i++) {
                    if (b[i] === null) {
                        b[i] = 'X';
                        const evaluation = minimax(b, depth + 1, true, alpha, beta);
                        b[i] = null;
                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                }
                return minEval;
            }
        }

        function getHeuristicMove(availableMoves) {
            const center = Math.floor(board.length / 2);
            if (availableMoves.includes(center)) return center;

            const corners = [0, gridSize - 1, gridSize * (gridSize - 1), gridSize * gridSize - 1];
            const freeCorners = corners.filter(c => availableMoves.includes(c));
            if (freeCorners.length > 0 && Math.random() < 0.65) {
                return freeCorners[Math.floor(Math.random() * freeCorners.length)];
            }

            return availableMoves[Math.floor(Math.random() * availableMoves.length)];
        }

        // Mode and Pill Selectors Setup
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gameMode = btn.dataset.mode;
                diffGroup.style.display = gameMode === 'bot' ? 'flex' : 'none';
                initBoard();
            });
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                botDifficulty = btn.dataset.diff;
                initBoard();
            });
        });

        document.querySelectorAll('.grid-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.grid-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gridSize = parseInt(btn.dataset.grid, 10);
                initBoard();
            });
        });

        // Restart & Score Reset
        document.getElementById('btn-restart').addEventListener('click', () => initBoard());
        document.getElementById('btn-reset-scores').addEventListener('click', () => {
            scores = { X: 0, O: 0, ties: 0 };
            initBoard();
        });

        // Start initial game
        initBoard();
    </script>
</body>
</html>
