<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bug Bunny: Carrot Dash 🐰🥕 — krazio games</title>
    <!-- Favicon -->
    <link rel="icon" href="../krazio-icon.svg" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- PixiJS v8 Accelerated 2D Engine -->
    <script src="https://pixijs.download/v8.8.1/pixi.min.js"></script>

    <style>
      :root {
        --primary: #f97316;
        --accent: #22c55e;
        --bg-dark: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --glass-bg: rgba(15, 23, 42, 0.88);
        --glass-border: rgba(255, 255, 255, 0.16);
        --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-dark);
        font-family: var(--font-main);
        color: var(--text-main);
        touch-action: none;
      }

      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a;
      }

      #pixi-canvas-wrapper {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }

      /* Top HUD */
      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }

      .hud-left-group,
      .hud-center-group,
      .hud-right-group {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      .hud-pill {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        padding: 8px 16px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 0.9rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        text-decoration: none;
        color: var(--text-main);
        white-space: nowrap;
      }

      .hud-pill.krazio-home-pill {
        background: rgba(30, 27, 75, 0.9);
        border-color: rgba(99, 102, 241, 0.5);
        transition: all 0.2s ease;
      }

      .hud-pill.krazio-home-pill:hover {
        background: rgba(79, 70, 229, 0.95);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
      }

      .hud-pill.score-pill {
        background: linear-gradient(135deg, rgba(249, 115, 22, 0.9), rgba(234, 88, 12, 0.9));
        border-color: rgba(251, 146, 60, 0.5);
        color: #fff;
      }

      .hud-pill.lives-pill {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.85), rgba(220, 38, 38, 0.85));
        border-color: rgba(248, 113, 113, 0.4);
      }

      .hud-btn {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.05rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      .hud-btn:hover {
        background: rgba(249, 115, 22, 0.9);
        transform: scale(1.1);
      }

      /* Mobile Controls */
      #mobile-controls {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
      }

      .mobile-dpad {
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }

      .mobile-btn {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      }

      .mobile-btn.btn-jump {
        width: 75px;
        height: 75px;
        background: linear-gradient(135deg, rgba(249, 115, 22, 0.85), rgba(234, 88, 12, 0.85));
        border-color: rgba(251, 146, 60, 0.6);
        pointer-events: auto;
      }

      /* Modals */
      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(5, 7, 20, 0.88);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-card {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.96));
        border: 1.5px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        padding: 36px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(249, 115, 22, 0.35);
        transform: scale(0.9);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .modal-overlay.active .modal-card {
        transform: scale(1);
      }

      .modal-title {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        background: linear-gradient(135deg, #fff, #fdba74);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .modal-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 24px;
      }

      .btn-cta {
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        color: #fff;
        border: none;
        font-size: 1.15rem;
        font-weight: 900;
        padding: 15px 32px;
        border-radius: 9999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 25px rgba(249, 115, 22, 0.5);
        transition: all 0.2s ease;
        width: 100%;
      }

      .btn-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(249, 115, 22, 0.7);
        filter: brightness(1.1);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e2e8f0;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 12px 20px;
        border-radius: 9999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        margin-top: 10px;
        width: 100%;
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      .stat-box {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 14px;
      }

      .stat-val {
        font-size: 1.6rem;
        font-weight: 900;
        color: #f97316;
        display: block;
      }

      .stat-lbl {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
      }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- PixiJS WebGL Render Canvas Wrapper -->
        <div id="pixi-canvas-wrapper"></div>

        <!-- Top HUD -->
        <div id="hud-overlay">
            <div class="hud-left-group">
                <a href="../index.html" class="hud-pill krazio-home-pill" title="Back to krazio games portal">
                    <img src="../krazio-icon.svg" alt="krazio" style="width: 18px; height: 18px; border-radius: 50%;">
                    <span>🏠 KRAZIO</span>
                </a>
                <div class="hud-pill score-pill">
                    🥕 <span id="hud-score-val">0</span>
                </div>
            </div>

            <div class="hud-center-group">
                <div class="hud-pill" id="hud-distance-pill">
                    🏃 <span id="hud-distance-val">0 m</span>
                </div>
            </div>

            <div class="hud-right-group">
                <div class="hud-pill lives-pill" id="hud-lives-val">
                    ❤️ ❤️ ❤️
                </div>
                <button class="hud-btn" id="btn-sound-toggle" title="Toggle Sound">🔊</button>
                <button class="hud-btn" id="btn-pause" title="Pause Game">⏸️</button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="mobile-controls">
            <div class="mobile-dpad">
                <button class="mobile-btn" id="btn-left">◀</button>
                <button class="mobile-btn" id="btn-right">▶</button>
            </div>
            <button class="mobile-btn btn-jump" id="btn-jump">🐇</button>
        </div>

        <!-- Start / Game Over Modal -->
        <div class="modal-overlay active" id="game-modal">
            <div class="modal-card">
                <div style="font-size: 3.8rem; margin-bottom: 8px;">🐰🥕✨</div>
                <h1 class="modal-title" id="modal-title">BUG BUNNY</h1>
                <p class="modal-subtitle" id="modal-subtitle">Sprint, leap, and chomp as many crunchy carrots as you can!</p>

                <div class="stat-grid" id="modal-stats" style="display: none;">
                    <div class="stat-box">
                        <span class="stat-val" id="stat-carrots">0</span>
                        <span class="stat-lbl">CARROTS</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val" id="stat-distance">0 m</span>
                        <span class="stat-lbl">DISTANCE</span>
                    </div>
                </div>

                <button class="btn-cta" id="btn-play-action">
                    <span id="btn-play-text">▶ PLAY NOW</span>
                </button>
            </div>
        </div>

        <!-- Pause Modal -->
        <div class="modal-overlay" id="pause-modal">
            <div class="modal-card">
                <h2 class="modal-title">GAME PAUSED</h2>
                <p class="modal-subtitle">What's up, Doc?</p>

                <button class="btn-cta" id="btn-resume">
                    <span>▶ RESUME GAME</span>
                </button>
                <button class="btn-secondary" id="btn-restart">
                    <span>🔄 RESTART</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Complete Audio & PixiJS Game Logic -->
    <script>
      // ==========================================
      // 1. Web Audio Engine
      // ==========================================
      class BunnyAudio {
        constructor() {
          this.ctx = null;
          this.muted = localStorage.getItem('bug_bunny_muted') === 'true';
        }

        init() {
          if (this.ctx) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          } catch (e) {}
        }

        ensure() {
          if (!this.ctx) this.init();
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }

        toggle() {
          this.muted = !this.muted;
          localStorage.setItem('bug_bunny_muted', this.muted.toString());
          return this.muted;
        }

        playChomp() {
          if (this.muted) return;
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        }

        playJump() {
          if (this.muted) return;
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(580, now + 0.14);

          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        }

        playHurt() {
          if (this.muted) return;
          this.ensure();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.25);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        }

        playPowerup() {
          if (this.muted) return;
          this.ensure();
          if (!this.ctx) return;
          const notes = [440, 554.37, 659.25, 880];
          notes.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const t = this.ctx.currentTime + i * 0.06;

            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t);
            osc.stop(t + 0.21);
          });
        }
      }

      const audio = new BunnyAudio();

      // ==========================================
      // 2. PixiJS Bug Bunny Game Engine
      // ==========================================
      class BugBunnyGame {
        constructor() {
          this.wrapper = document.getElementById('pixi-canvas-wrapper');
          this.app = new PIXI.Application();
          
          this.score = 0;
          this.distance = 0;
          this.lives = 3;
          this.gameState = 'menu';
          
          this.keys = { left: false, right: false, up: false };
          this.carrots = [];
          this.hazards = [];
          this.particles = [];
          
          this.init();
        }

        async init() {
          await this.app.init({
            background: '#0c1024',
            resizeTo: window,
            antialias: true,
            resolution: Math.min(window.devicePixelRatio || 1, 2),
            autoDensity: true,
          });

          this.wrapper.appendChild(this.app.canvas);

          this.bgContainer = new PIXI.Container();
          this.worldContainer = new PIXI.Container();
          this.fgContainer = new PIXI.Container();

          this.app.stage.addChild(this.bgContainer);
          this.app.stage.addChild(this.worldContainer);
          this.app.stage.addChild(this.fgContainer);

          this.createBackground();
          this.createBunnyCharacter();
          this.bindControls();

          this.app.ticker.add((time) => this.gameLoop(time.deltaTime));
        }

        createBackground() {
          this.bgGraphics = new PIXI.Graphics();
          this.bgContainer.addChild(this.bgGraphics);
          this.renderBackdrop();
          window.addEventListener('resize', () => this.renderBackdrop());
        }

        renderBackdrop() {
          const w = this.app.screen.width;
          const h = this.app.screen.height;
          const g = this.bgGraphics;
          g.clear();

          // Rolling hills
          g.beginPath();
          g.moveTo(0, h * 0.65);
          g.bezierCurveTo(w * 0.25, h * 0.55, w * 0.75, h * 0.75, w, h * 0.6);
          g.lineTo(w, h);
          g.lineTo(0, h);
          g.closePath();
          g.fill({ color: 0x14532d, alpha: 0.6 });

          // Fore-hill grass floor
          this.groundY = h * 0.76;
          g.rect(0, this.groundY, w, h - this.groundY);
          g.fill({ color: 0x166534 });

          // Grass surface highlight
          g.rect(0, this.groundY, w, 8);
          g.fill({ color: 0x22c55e });
        }

        createBunnyCharacter() {
          this.bunnyContainer = new PIXI.Container();
          this.worldContainer.addChild(this.bunnyContainer);

          const bg = new PIXI.Graphics();

          // Bunny Ears
          bg.ellipse(-10, -32, 6, 18);
          bg.ellipse(10, -32, 6, 18);
          bg.fill({ color: 0xe2e8f0 });
          bg.ellipse(-10, -32, 3, 12);
          bg.ellipse(10, -32, 3, 12);
          bg.fill({ color: 0xf472b6 });

          // Bunny Head
          bg.circle(0, -12, 16);
          bg.fill({ color: 0xe2e8f0 });

          // Cheeks & Snout
          bg.circle(-6, -6, 8);
          bg.circle(6, -6, 8);
          bg.fill({ color: 0xffffff });

          // Big Eyes
          bg.ellipse(-6, -16, 4, 7);
          bg.ellipse(6, -16, 4, 7);
          bg.fill({ color: 0xffffff });
          bg.circle(-5, -16, 2.5);
          bg.circle(7, -16, 2.5);
          bg.fill({ color: 0x0f172a });

          // Pink Nose
          bg.beginPath();
          bg.moveTo(-3, -8);
          bg.lineTo(3, -8);
          bg.lineTo(0, -5);
          bg.closePath();
          bg.fill({ color: 0xf472b6 });

          // Big Buck Teeth
          bg.rect(-4, -4, 4, 6);
          bg.rect(0, -4, 4, 6);
          bg.fill({ color: 0xffffff });
          bg.stroke({ width: 0.8, color: 0x94a3b8 });

          // Body
          bg.ellipse(0, 10, 14, 18);
          bg.fill({ color: 0xe2e8f0 });
          bg.ellipse(0, 12, 9, 13);
          bg.fill({ color: 0xffffff });

          // Feet
          bg.ellipse(-10, 26, 9, 5);
          bg.ellipse(10, 26, 9, 5);
          bg.fill({ color: 0xffffff });

          this.bunnyContainer.addChild(bg);

          this.bunny = {
            x: 140,
            y: this.groundY - 26,
            vx: 0,
            vy: 0,
            isGrounded: true,
            jumps: 0,
            jumpPower: -13.5,
            speed: 5.5,
          };
        }

        bindControls() {
          window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
              e.preventDefault();
              this.jump();
            }
          });

          window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
          });

          const leftBtn = document.getElementById('btn-left');
          const rightBtn = document.getElementById('btn-right');
          const jumpBtn = document.getElementById('btn-jump');

          if (leftBtn) {
            leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys.left = true; });
            leftBtn.addEventListener('touchend', () => { this.keys.left = false; });
          }
          if (rightBtn) {
            rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys.right = true; });
            rightBtn.addEventListener('touchend', () => { this.keys.right = false; });
          }
          if (jumpBtn) {
            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.jump(); });
          }
        }

        jump() {
          if (this.gameState !== 'playing') return;
          if (this.bunny.jumps < 2) {
            this.bunny.vy = this.bunny.jumpPower;
            this.bunny.isGrounded = false;
            this.bunny.jumps++;
            audio.playJump();
            this.spawnDust(this.bunny.x, this.bunny.y + 26);
          }
        }

        start() {
          this.score = 0;
          this.distance = 0;
          this.lives = 3;
          this.gameState = 'playing';

          this.bunny.x = 140;
          this.bunny.y = this.groundY - 26;
          this.bunny.vx = 0;
          this.bunny.vy = 0;

          this.carrots.forEach(c => c.graphic.destroy());
          this.hazards.forEach(h => h.graphic.destroy());
          this.carrots = [];
          this.hazards = [];

          this.updateHUD();

          const modal = document.getElementById('game-modal');
          if (modal) modal.classList.remove('active');
        }

        spawnCarrot() {
          const g = new PIXI.Graphics();
          g.beginPath();
          g.moveTo(0, 16);
          g.lineTo(-7, -4);
          g.lineTo(7, -4);
          g.closePath();
          g.fill({ color: 0xf97316 });

          g.ellipse(-4, -9, 3, 7);
          g.ellipse(4, -9, 3, 7);
          g.ellipse(0, -11, 3.5, 8);
          g.fill({ color: 0x22c55e });

          this.worldContainer.addChild(g);

          const isGolden = Math.random() < 0.2;
          if (isGolden) g.tint = 0xffd700;

          const yOffset = Math.random() < 0.5 ? this.groundY - 30 : this.groundY - 95;
          const item = {
            graphic: g,
            x: this.app.screen.width + 60,
            y: yOffset,
            isGolden,
            rotSpeed: 0.05,
          };
          this.carrots.push(item);
        }

        spawnHazard() {
          const g = new PIXI.Graphics();
          const isTNT = Math.random() < 0.5;

          if (isTNT) {
            g.roundRect(-14, -14, 28, 28, 4);
            g.fill({ color: 0xdc2626 });
            g.rect(-10, -4, 20, 8);
            g.fill({ color: 0xffffff });
          } else {
            g.beginPath();
            g.moveTo(-16, 12);
            g.lineTo(0, -14);
            g.lineTo(16, 12);
            g.closePath();
            g.fill({ color: 0x64748b });
          }

          this.worldContainer.addChild(g);

          const item = {
            graphic: g,
            x: this.app.screen.width + 60,
            y: this.groundY - 14,
            isTNT,
            rotSpeed: 0,
          };
          this.hazards.push(item);
        }

        spawnDust(x, y) {
          for (let i = 0; i < 6; i++) {
            const g = new PIXI.Graphics();
            g.circle(0, 0, 3 + Math.random() * 3);
            g.fill({ color: 0x86efac, alpha: 0.7 });
            g.position.set(x + (Math.random() * 20 - 10), y);
            this.worldContainer.addChild(g);

            this.particles.push({
              graphic: g,
              vx: Math.random() * 4 - 2,
              vy: -Math.random() * 3,
              alpha: 0.7,
            });
          }
        }

        gameLoop(dt) {
          if (this.gameState !== 'playing') return;

          this.distance += 0.15 * dt;

          // Player Movement & Physics
          if (this.keys.left) this.bunny.vx = -this.bunny.speed;
          else if (this.keys.right) this.bunny.vx = this.bunny.speed;
          else this.bunny.vx *= 0.82;

          this.bunny.vy += 0.55 * dt;
          this.bunny.x += this.bunny.vx * dt;
          this.bunny.y += this.bunny.vy * dt;

          if (this.bunny.y >= this.groundY - 26) {
            this.bunny.y = this.groundY - 26;
            this.bunny.vy = 0;
            this.bunny.isGrounded = true;
            this.bunny.jumps = 0;
          }

          this.bunny.x = Math.max(30, Math.min(this.app.screen.width - 30, this.bunny.x));

          this.bunnyContainer.position.set(this.bunny.x, this.bunny.y);
          if (this.bunny.vx !== 0) {
            this.bunnyContainer.scale.x = this.bunny.vx > 0 ? 1 : -1;
          }

          if (Math.random() < 0.025) this.spawnCarrot();
          if (Math.random() < 0.012) this.spawnHazard();

          // Carrots
          for (let i = this.carrots.length - 1; i >= 0; i--) {
            const c = this.carrots[i];
            c.x -= 4.2 * dt;
            c.graphic.position.set(c.x, c.y);
            c.graphic.rotation += c.rotSpeed * dt;

            const dx = this.bunny.x - c.x;
            const dy = this.bunny.y - c.y;
            if (Math.hypot(dx, dy) < 32) {
              this.score += c.isGolden ? 50 : 10;
              audio.playChomp();
              this.spawnDust(c.x, c.y);
              c.graphic.destroy();
              this.carrots.splice(i, 1);
              this.updateHUD();
              continue;
            }

            if (c.x < -60) {
              c.graphic.destroy();
              this.carrots.splice(i, 1);
            }
          }

          // Hazards
          for (let i = this.hazards.length - 1; i >= 0; i--) {
            const h = this.hazards[i];
            h.x -= 4.5 * dt;
            h.graphic.position.set(h.x, h.y);

            const dx = this.bunny.x - h.x;
            const dy = this.bunny.y - h.y;
            if (Math.hypot(dx, dy) < 28) {
              this.lives--;
              audio.playHurt();
              this.spawnDust(h.x, h.y);
              h.graphic.destroy();
              this.hazards.splice(i, 1);
              this.updateHUD();

              if (this.lives <= 0) {
                this.gameOver();
              }
              continue;
            }

            if (h.x < -60) {
              h.graphic.destroy();
              this.hazards.splice(i, 1);
            }
          }

          // Particles
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.graphic.x += p.vx * dt;
            p.graphic.y += p.vy * dt;
            p.alpha -= 0.03 * dt;
            p.graphic.alpha = p.alpha;
            if (p.alpha <= 0) {
              p.graphic.destroy();
              this.particles.splice(i, 1);
            }
          }

          this.updateHUD();
        }

        updateHUD() {
          const scoreEl = document.getElementById('hud-score-val');
          const distEl = document.getElementById('hud-distance-val');
          const livesEl = document.getElementById('hud-lives-val');

          if (scoreEl) scoreEl.textContent = this.score;
          if (distEl) distEl.textContent = `${Math.floor(this.distance)} m`;
          if (livesEl) {
            const hearts = '❤️ '.repeat(Math.max(0, this.lives)) || '💀';
            livesEl.textContent = hearts;
          }
        }

        gameOver() {
          this.gameState = 'gameover';
          const modal = document.getElementById('game-modal');
          const title = document.getElementById('modal-title');
          const sub = document.getElementById('modal-subtitle');
          const stats = document.getElementById('modal-stats');
          const btnText = document.getElementById('btn-play-text');
          const statC = document.getElementById('stat-carrots');
          const statD = document.getElementById('stat-distance');

          if (title) title.textContent = 'GAME OVER!';
          if (sub) sub.textContent = "That's all folks! Great carrot run, Doc!";
          if (statC) statC.textContent = this.score;
          if (statD) statD.textContent = `${Math.floor(this.distance)} m`;
          if (stats) stats.style.display = 'grid';
          if (btnText) btnText.textContent = '🔄 PLAY AGAIN';
          if (modal) modal.classList.add('active');
        }

        togglePause() {
          if (this.gameState === 'playing') {
            this.gameState = 'paused';
            const modal = document.getElementById('pause-modal');
            if (modal) modal.classList.add('active');
          } else if (this.gameState === 'paused') {
            this.gameState = 'playing';
            const modal = document.getElementById('pause-modal');
            if (modal) modal.classList.remove('active');
          }
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        window.bunnyGame = new BugBunnyGame();

        const playBtn = document.getElementById('btn-play-action');
        const soundBtn = document.getElementById('btn-sound-toggle');
        const pauseBtn = document.getElementById('btn-pause');
        const resumeBtn = document.getElementById('btn-resume');
        const restartBtn = document.getElementById('btn-restart');

        if (playBtn) {
          playBtn.addEventListener('click', () => {
            audio.ensure();
            if (window.bunnyGame) window.bunnyGame.start();
          });
        }

        if (soundBtn) {
          soundBtn.addEventListener('click', () => {
            const muted = audio.toggle();
            soundBtn.textContent = muted ? '🔇' : '🔊';
          });
        }

        if (pauseBtn) {
          pauseBtn.addEventListener('click', () => {
            if (window.bunnyGame) window.bunnyGame.togglePause();
          });
        }

        if (resumeBtn) {
          resumeBtn.addEventListener('click', () => {
            if (window.bunnyGame) window.bunnyGame.togglePause();
          });
        }

        if (restartBtn) {
          restartBtn.addEventListener('click', () => {
            const pModal = document.getElementById('pause-modal');
            if (pModal) pModal.classList.remove('active');
            if (window.bunnyGame) window.bunnyGame.start();
          });
        }
      });
    </script>
</body>
</html>
